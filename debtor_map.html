<style>
:root{
  --bg:#0f0f13;--surface:#18181f;--card:#1e1e28;--border:#2a2a38;
  --nav-bg:rgba(15,15,19,.96);
  --accent:#f0c040;--green:#3ddc84;--red:#ff5f5f;--orange:#ff9a3c;
  --blue:#4da6ff;--purple:#a78bfa;--text:#f0f0f5;--muted:#7070a0;
  --display:'Bebas Neue',sans-serif;--body:'DM Sans',sans-serif;--mono:'DM Mono',monospace;
}
:root[data-theme="light"]{
  --bg:#f5f3ee;--surface:#fffaf0;--card:#ffffff;--border:#ded8ca;
  --nav-bg:rgba(255,250,240,.96);
  --accent:#d9a921;--green:#12884e;--red:#d33f49;--orange:#c76b1d;
  --blue:#1169b8;--purple:#7857d8;--text:#1c1b19;--muted:#736f83;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--body);background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;}
#header{background:var(--surface);padding:8px 12px 6px;border-bottom:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:space-between;}
#header h1{font-family:var(--display);font-size:20px;letter-spacing:.05em;color:var(--text);}
#header .sub{font-family:var(--mono);font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-top:1px;}
.theme-btn{background:none;border:1px solid var(--border);color:var(--muted);font-family:var(--mono);font-size:10px;padding:4px 8px;border-radius:6px;cursor:pointer;}
#controls{background:var(--surface);padding:6px 12px;border-bottom:1px solid var(--border);flex-shrink:0;}
#search-row{display:flex;gap:6px;margin-bottom:6px;}
#search{flex:1;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font-family:var(--body);font-size:13px;outline:none;}
#search::placeholder{color:var(--muted);}
#search:focus{border-color:var(--accent);}
#clear-btn{padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--accent);font-family:var(--mono);font-size:11px;cursor:pointer;white-space:nowrap;font-weight:500;}
.filter-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:5px;align-items:center;}
.filter-label{font-family:var(--mono);font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-right:2px;min-width:32px;}
.day-btn{padding:4px 9px;border-radius:20px;border:2px solid var(--dc,#555);background:var(--dc,#555);font-family:var(--mono);font-size:10px;cursor:pointer;font-weight:500;color:#fff;opacity:0.35;transition:opacity .15s,transform .1s;}
.day-btn.active{opacity:1;}
.all-btn{padding:4px 9px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-family:var(--mono);font-size:10px;cursor:pointer;font-weight:500;opacity:0.6;transition:all .15s;}
.all-btn.active{border-color:var(--accent);color:var(--accent);opacity:1;}
.agent-select{padding:5px 8px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font-family:var(--mono);font-size:11px;outline:none;}
.agent-select:focus{border-color:var(--accent);}
.toggle-btn{padding:4px 11px;border-radius:20px;border:2px solid;font-family:var(--mono);font-size:10px;cursor:pointer;font-weight:500;transition:all .15s;}
.toggle-btn.active-on{border-color:var(--green);background:var(--green);color:#000;}
.toggle-btn.active-off{border-color:var(--green);background:transparent;color:var(--green);opacity:0.4;}
.toggle-btn.inactive-on{border-color:var(--red);background:var(--red);color:#fff;}
.toggle-btn.inactive-off{border-color:var(--red);background:transparent;color:var(--red);opacity:0.4;}
#stats{font-family:var(--mono);font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
#map{flex:1;}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--nav-bg);backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:8px 0 12px;z-index:1000;}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;opacity:.4;transition:opacity .2s;min-width:44px;text-decoration:none;color:inherit;}
.nav-item.active{opacity:1;}
.nav-icon{font-size:18px;}
.nav-label{font-family:var(--mono);font-size:8px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);}
.nav-item.active .nav-label{color:var(--accent);}
/* popup */
.popup-box{font-family:'DM Sans',Arial,sans-serif;font-size:13px;min-width:200px;}
.popup-box .pname{font-weight:600;font-size:14px;margin-bottom:5px;word-break:break-word;line-height:1.3;}
.popup-box .prow{margin:3px 0;font-size:12px;color:#555;}
.popup-box .prow b{color:#222;}
.popup-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:bold;color:#fff;margin-top:5px;}
.pbadge-active{background:#3ddc84;color:#000;}
.pbadge-inactive{background:#ff5f5f;}
.nav-btns{display:flex;gap:6px;margin-top:8px;}
.nav-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:8px 6px;border-radius:8px;font-size:12px;font-weight:600;color:#fff;text-decoration:none;}
.nav-btn-gmaps{background:#4285F4;}
.nav-btn-waze{background:#33CCFF;color:#1a1a1a;}
</style>
</head>
<body>
<div id="header">
  <div>
    <div class="sub">Miracle Group</div>
    <h1>&#128205; DEBTOR MAP</h1>
  </div>
  <div style="display:flex;align-items:center;gap:8px;">
    <span id="stats">Loading...</span>
    <button class="theme-btn" onclick="toggleTheme()">&#9788;</button>
  </div>
</div>
<div id="controls">
  <div id="search-row">
    <input id="search" type="search" placeholder="Search debtor name or code...">
    <button id="clear-btn" onclick="clearFilters()">Reset</button>
  </div>
  <div class="filter-row">
    <span class="filter-label">Day</span>
    <button class="all-btn active" data-day="ALL" onclick="toggleDay(this)">All</button>
<button class="day-btn active" data-day="Monday" style="--dc:#e74c3c" onclick="toggleDay(this)">Mon</button>
<button class="day-btn active" data-day="Tuesday" style="--dc:#e67e22" onclick="toggleDay(this)">Tue</button>
<button class="day-btn active" data-day="Wednesday" style="--dc:#27ae60" onclick="toggleDay(this)">Wed</button>
<button class="day-btn active" data-day="Thursday" style="--dc:#4da6ff" onclick="toggleDay(this)">Thu</button>
<button class="day-btn active" data-day="Friday" style="--dc:#a78bfa" onclick="toggleDay(this)">Fri</button>
<button class="day-btn active" data-day="Saturday" style="--dc:#16a085" onclick="toggleDay(this)">Sat</button>
<button class="day-btn active" data-day="Sunday" style="--dc:#f0c040" onclick="toggleDay(this)">Sun</button>
<button class="day-btn active" data-day="Random" style="--dc:#7070a0" onclick="toggleDay(this)">Ran</button>
  </div>
  <div class="filter-row">
    <span class="filter-label">Agent</span>
    <select class="agent-select" id="agent-select" onchange="applyFilters()">
      <option value="ALL">All Agents</option>
<option value="BEN">BEN</option><option value="CJ">CJ</option><option value="DEE">DEE</option><option value="JACKY">JACKY</option><option value="JAMES">JAMES</option><option value="KEE">KEE</option><option value="KF">KF</option><option value="KI-MI">KI-MI</option><option value="KW">KW</option><option value="LEON">LEON</option><option value="NMK">NMK</option><option value="SAM">SAM</option><option value="XIAN">XIAN</option><option value="YI">YI</option>
    </select>
    <div style="margin-left:auto;display:flex;gap:6px;">
      <button class="toggle-btn active-on" id="btn-active" onclick="toggleActive()">&#10003; Active</button>
      <button class="toggle-btn inactive-on" id="btn-inactive" onclick="toggleInactive()">&#10007; Inactive</button>
    </div>
  </div>
</div>
<div id="map"></div>

me": "SAIFUL RIZAL", "phone": "+60168913499", "agent": "SAM", "day": "", "active": "Checked", "area": "GRP 2A", "lat": 4.245572, "lng": 101.976262}, {"code": "3EV-R0536", "name": "SHAKIR", "phone": "+601133736220", "agent": "JAMES", "day": "", "active": "Checked", "area": "GRP 2A", "lat": 5.268623, "lng": 103.095024}, {"code": "3EV-R0537", "name": "MIQHAIL", "phone": "+60146511209", "agent": "KI-MI", "day": "", "active": "Checked", "area": "GRP 2A", "lat": 6.000794, "lng": 102.338941}, {"code": "3EV-R0539", "name": "MUHAMMAD HUSSEIN", "phone": "+60147174799", "agent": "SAM", "day": "", "active": "Checked", "area": "GRP 2A", "lat": 4.219104, "lng": 101.957445}, {"code": "3EV-R0546", "name": "MOHAMAL SOHEL", "phone": "+601131527976", "agent": "SAM", "day": "", "active": "Checked", "area": "GRP 2A", "lat": 4.265847, "lng": 102.0852}, {"code": "3EV-R0549", "name": "ANAS ADIB", "phone": "+60122185963", "agent": "JACKY", "day": "", "active": "Checked", "area": "GRP 2A", "lat": 4.864739, "lng": 101.955828}, {"code": "3EV-R0558", "name": "TARMIZI", "phone": "+601141242779", "agent": "LEON", "day": "", "active": "Checked", "area": "GRP 2A", "lat": 4.016194, "lng": 103.152731}, {"code": "3EV-R0566", "name": "HEDAYET ULLAH", "phone": "+601172624904", "agent": "JAMES", "day": "", "active": "Checked", "area": "GRP 2A", "lat": 5.094492, "lng": 103.120664}, {"code": "3EV-R0567", "name": "ROBERT", "phone": "+6282275069179", "agent": "JACKY", "day": "", "active": "Checked", "area": "GRP 2A", "lat": 4.705287, "lng": 101.62166}, {"code": "3EV-R0575", "name": "ISKANDAR", "phone": "+60147936044", "agent": "KI-MI", "day": "", "active": "Checked", "area": "GRP 2A", "lat": 6.149644, "lng": 102.307711}, {"code": "3EV-R0576", "name": "EDI", "phone": "+60146397969", "agent": "JAMES", "day": "", "active": "Checked", "area": "GRP 2A", "lat": 5.356681, "lng": 103.067039}, {"code": "3EV-R0579", "name": "ARADI", "phone": "+6285361986185", "agent": "YI", "day": "", "active": "Checked", "area": "GRP 2A", "lat": 5.921152, "lng": 102.244539}];
const DAY_COLORS = {"Monday": "#e74c3c", "Tuesday": "#e67e22", "Wednesday": "#27ae60", "Thursday": "#4da6ff", "Friday": "#a78bfa", "Saturday": "#16a085", "Sunday": "#f0c040", "Random": "#7070a0"};
const DAYS_ORDER = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday", "Random"];

// Theme
const saved = localStorage.getItem('md-theme');
if (saved) document.documentElement.setAttribute('data-theme', saved);
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next === 'dark' ? '' : 'light');
  localStorage.setItem('md-theme', next === 'dark' ? '' : 'light');
}

let showActive = true, showInactive = true;
let activeDays = new Set(['ALL', ...DAYS_ORDER]);
let searchTerm = '', agentFilter = 'ALL';
let allMarkers = [];
let clusterGroup;

const map = L.map('map', {paddingBottomLeft: [0, 60]}).setView([5.85, 102.05], 10);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors', maxZoom: 19
}).addTo(map);

function makeIcon(day, isActive) {
  const color = DAY_COLORS[day] || '#7070a0';
  const op = isActive ? '1' : '0.4';
  const cross = isActive ? '' : '<line x1="5" y1="5" x2="19" y2="19" stroke="#fff" stroke-width="2.5" opacity="0.9"/><line x1="19" y1="5" x2="5" y2="19" stroke="#fff" stroke-width="2.5" opacity="0.9"/>';
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="26" height="34" viewBox="0 0 26 34">
    <path d="M13 0C5.8 0 0 5.8 0 13c0 9.5 13 21 13 21S26 22.5 26 13C26 5.8 20.2 0 13 0z" fill="${color}" opacity="${op}"/>
    <circle cx="13" cy="13" r="6" fill="#fff" opacity="${op}"/>
    ${cross}
  </svg>`;
  return L.divIcon({ html: svg, iconSize:[26,34], iconAnchor:[13,34], popupAnchor:[0,-32], className:'' });
}

function buildMarkers() {
  clusterGroup = L.markerClusterGroup({
    maxClusterRadius: 55,
    spiderfyOnMaxZoom: true,
    showCoverageOnHover: false,
    zoomToBoundsOnClick: true,
    iconCreateFunction: function(cluster) {
      const n = cluster.getChildCount();
      const sz = n < 10 ? 34 : n < 100 ? 40 : 48;
      return L.divIcon({
        html: `<div style="background:rgba(240,192,64,0.9);color:#000;border-radius:50%;width:${sz}px;height:${sz}px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:${n<10?13:11}px;border:2px solid rgba(255,255,255,0.5);box-shadow:0 2px 8px rgba(0,0,0,0.5);">${n}</div>`,
        iconSize:[sz,sz], className:''
      });
    }
  });

  RAW.forEach(r => {
    const isActive = r.active === 'Checked';
    const marker = L.marker([r.lat, r.lng], {icon: makeIcon(r.day, isActive)});
    const dayColor = DAY_COLORS[r.day] || '#7070a0';
    const phoneLink = r.phone ? `<a href="tel:${r.phone}" style="color:#4da6ff;font-weight:600;text-decoration:none;">${r.phone}</a>` : '-';
    const badge = isActive
      ? `<span class="popup-badge pbadge-active">&#10003; Active</span>`
      : `<span class="popup-badge pbadge-inactive">&#10007; Inactive</span>`;
    const gmapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${r.lat},${r.lng}`;
    const wazeUrl  = `https://waze.com/ul?ll=${r.lat},${r.lng}&navigate=yes`;
    marker.bindPopup(`
      <div class="popup-box">
        <div class="pname">${r.name || r.code}</div>
        <div class="prow"><b>Code:</b> ${r.code}</div>
        <div class="prow"><b>Agent:</b> ${r.agent}</div>
        <div class="prow"><b>Visit Day:</b> <span style="color:${dayColor};font-weight:600;">${r.day}</span></div>
        <div class="prow"><b>Area:</b> ${r.area}</div>
        <div class="prow"><b>Phone:</b> ${phoneLink}</div>
        <div>${badge}</div>
        <div class="nav-btns">
          <a class="nav-btn nav-btn-gmaps" href="${gmapsUrl}" target="_blank">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="#fff"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
            Google Maps
          </a>
          <a class="nav-btn nav-btn-waze" href="${wazeUrl}" target="_blank">
            <svg width="13" height="13" viewBox="0 0 32 32"><ellipse cx="16" cy="18" rx="13" ry="11" fill="#1a1a1a"/><circle cx="10" cy="23" r="3" fill="#fff"/><circle cx="22" cy="23" r="3" fill="#fff"/><path d="M9 14 Q16 8 23 14" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
            Waze
          </a>
        </div>
      </div>`, {maxWidth: 280});
    marker._data = r;
    marker._isActive = isActive;
    allMarkers.push(marker);
  });
}

function applyFilters() {
  searchTerm = document.getElementById('search').value.trim().toLowerCase();
  agentFilter = document.getElementById('agent-select').value;
  const allOn = activeDays.has('ALL');
  clusterGroup.clearLayers();
  let shown = 0;
  allMarkers.forEach(m => {
    const r = m._data;
    const dayMatch = allOn || activeDays.has(r.day);
    const agentMatch = agentFilter === 'ALL' || r.agent === agentFilter;
    const statusMatch = (m._isActive && showActive) || (!m._isActive && showInactive);
    const searchMatch = !searchTerm || r.name.toLowerCase().includes(searchTerm) || r.code.toLowerCase().includes(searchTerm);
    if (dayMatch && agentMatch && statusMatch && searchMatch) {
      clusterGroup.addLayer(m);
      shown++;
    }
  });
  map.addLayer(clusterGroup);
  document.getElementById('stats').textContent = `${shown.toLocaleString()} / ${allMarkers.length.toLocaleString()} debtors`;
}

function toggleDay(btn) {
  const day = btn.dataset.day;
  if (day === 'ALL') {
    const allOn = activeDays.has('ALL');
    if (allOn) {
      activeDays.clear();
      document.querySelectorAll('.day-btn,.all-btn').forEach(b => b.classList.remove('active'));
    } else {
      activeDays = new Set(['ALL', ...DAYS_ORDER]);
      document.querySelectorAll('.day-btn,.all-btn').forEach(b => b.classList.add('active'));
    }
  } else {
    if (activeDays.has(day)) {
      activeDays.delete(day); activeDays.delete('ALL');
      btn.classList.remove('active');
      document.querySelector('[data-day="ALL"]').classList.remove('active');
    } else {
      activeDays.add(day); btn.classList.add('active');
      if (activeDays.size === DAYS_ORDER.length) {
        activeDays.add('ALL');
        document.querySelector('[data-day="ALL"]').classList.add('active');
      }
    }
  }
  applyFilters();
}

function toggleActive() {
  showActive = !showActive;
  document.getElementById('btn-active').className = 'toggle-btn ' + (showActive ? 'active-on' : 'active-off');
  applyFilters();
}

function toggleInactive() {
  showInactive = !showInactive;
  document.getElementById('btn-inactive').className = 'toggle-btn ' + (showInactive ? 'inactive-on' : 'inactive-off');
  applyFilters();
}

function clearFilters() {
  document.getElementById('search').value = '';
  document.getElementById('agent-select').value = 'ALL';
  showActive = true; showInactive = true;
  activeDays = new Set(['ALL', ...DAYS_ORDER]);
  document.querySelectorAll('.day-btn,.all-btn').forEach(b => b.classList.add('active'));
  document.getElementById('btn-active').className = 'toggle-btn active-on';
  document.getElementById('btn-inactive').className = 'toggle-btn inactive-on';
  applyFilters();
}

let st;
document.getElementById('search').addEventListener('input', () => { clearTimeout(st); st = setTimeout(applyFilters, 300); });

buildMarkers();
applyFilters();
</script>
</body>
</html>
