<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Debtor Map — MD Dashboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📍</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
<style>
:root{
  --bg:#0f0f13;--surface:#18181f;--card:#1e1e28;--border:#2a2a38;
  --nav-bg:rgba(15,15,19,.96);
  --accent:#f0c040;--green:#3ddc84;--red:#ff5f5f;--orange:#ff9a3c;
  --blue:#4da6ff;--purple:#a78bfa;--text:#f0f0f5;--muted:#7070a0;
  --display:'Bebas Neue',sans-serif;--body:'DM Sans',sans-serif;--mono:'DM Mono',monospace;
}
:root[data-theme="light"]{
  --bg:#f5f3ee;--surface:#fffaf0;--card:#ffffff;--border:#ded8ca;
  --nav-bg:rgba(255,250,240,.96);
  --accent:#d9a921;--green:#12884e;--red:#d33f49;--orange:#c76b1d;
  --blue:#1169b8;--purple:#7857d8;--text:#1c1b19;--muted:#736f83;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--body);background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;}

#auth-overlay{position:fixed;inset:0;background:var(--bg);z-index:9999;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:24px;}
#auth-overlay h2{font-family:var(--display);font-size:28px;color:var(--text);letter-spacing:.05em;}
#auth-overlay p{font-family:var(--mono);font-size:11px;color:var(--muted);}
#auth-overlay a{font-family:var(--mono);font-size:12px;color:var(--accent);text-decoration:none;border:1px solid var(--accent);padding:9px 22px;border-radius:8px;margin-top:8px;display:inline-block;}

#loading{position:fixed;inset:0;background:var(--bg);z-index:9998;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;}
#loading h2{font-family:var(--display);font-size:24px;color:var(--text);letter-spacing:.05em;}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
#loading p{font-family:var(--mono);font-size:10px;color:var(--muted);}

/* Header */
#header{background:var(--surface);padding:8px 12px 6px;border-bottom:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:space-between;}
#header h1{font-family:var(--display);font-size:20px;letter-spacing:.05em;color:var(--text);}
.sub{font-family:var(--mono);font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-top:1px;}
.agent-badge{font-family:var(--mono);font-size:10px;background:rgba(240,192,64,.15);color:var(--accent);border:1px solid rgba(240,192,64,.3);padding:3px 9px;border-radius:20px;}
.theme-btn{background:none;border:1px solid var(--border);color:var(--muted);font-family:var(--mono);font-size:10px;padding:4px 8px;border-radius:6px;cursor:pointer;}
#header.agent-mode{padding:6px 12px;}
#header.agent-mode h1{font-size:16px;}
#header.agent-mode .sub{display:none;}

/* Legend bar — agent mode only */
#legend-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:6px 12px;display:none;gap:12px;align-items:center;flex-wrap:wrap;}
.leg{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;color:var(--muted);}
.leg-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;}

/* Day route strip — agent mode */
#day-strip{background:var(--surface);border-bottom:1px solid var(--border);padding:5px 10px;display:none;gap:5px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
#day-strip::-webkit-scrollbar{display:none;}
.day-strip-btn{padding:5px 12px;border-radius:20px;border:2px solid var(--dc,#555);background:transparent;color:var(--dc,#555);font-family:var(--mono);font-size:11px;cursor:pointer;font-weight:600;white-space:nowrap;opacity:.45;transition:all .15s;flex-shrink:0;}
.day-strip-btn.active{background:var(--dc,#555);color:#fff;opacity:1;}
.day-strip-btn.today-btn{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--dc,#555);}

/* Admin controls */
#controls{background:var(--surface);padding:6px 12px;border-bottom:1px solid var(--border);flex-shrink:0;}
#search-row{display:flex;gap:6px;margin-bottom:6px;}
#search{flex:1;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font-family:var(--body);font-size:13px;outline:none;}
#search::placeholder{color:var(--muted);}
#search:focus{border-color:var(--accent);}
#clear-btn{padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--accent);font-family:var(--mono);font-size:11px;cursor:pointer;white-space:nowrap;}
.filter-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:5px;align-items:center;}
.filter-label{font-family:var(--mono);font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-right:2px;min-width:30px;}
.day-btn{padding:4px 9px;border-radius:20px;border:2px solid var(--dc,#555);background:var(--dc,#555);font-family:var(--mono);font-size:10px;cursor:pointer;font-weight:500;color:#fff;opacity:0.35;transition:opacity .15s;}
.day-btn.active{opacity:1;}
.all-btn{padding:4px 9px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-family:var(--mono);font-size:10px;cursor:pointer;font-weight:500;opacity:0.6;}
.all-btn.active{border-color:var(--accent);color:var(--accent);opacity:1;}
.agent-select{padding:5px 8px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font-family:var(--mono);font-size:11px;outline:none;}
.toggle-btn{padding:4px 11px;border-radius:20px;border:2px solid;font-family:var(--mono);font-size:10px;cursor:pointer;font-weight:500;transition:all .15s;}
.toggle-btn.on-g{border-color:var(--green);background:var(--green);color:#000;}
.toggle-btn.off-g{border-color:var(--green);background:transparent;color:var(--green);opacity:0.4;}
.toggle-btn.on-r{border-color:var(--red);background:var(--red);color:#fff;}
.toggle-btn.off-r{border-color:var(--red);background:transparent;color:var(--red);opacity:0.4;}
.toggle-btn.on-o{border-color:var(--orange);background:var(--orange);color:#000;}
.toggle-btn.off-o{border-color:var(--orange);background:transparent;color:var(--orange);opacity:0.4;}
#stats{font-family:var(--mono);font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}

#map{flex:1;margin-bottom:64px;}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--nav-bg);backdrop-filter:blur(12px);border-top:2px solid var(--border);display:flex;justify-content:space-around;align-items:center;padding:10px 0;padding-bottom:calc(10px + env(safe-area-inset-bottom));z-index:1000;min-height:64px;}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;opacity:.4;transition:opacity .2s;min-width:80px;text-decoration:none;color:inherit;padding:4px 0;}
.nav-item.active{opacity:1;}
.nav-icon{font-size:22px;}
.nav-label{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);}
.nav-item.active .nav-label{color:var(--accent);}

/* Popup */
.popup-box{font-family:'DM Sans',Arial,sans-serif;font-size:13px;min-width:200px;}
.popup-box .pname{font-weight:600;font-size:14px;margin-bottom:5px;word-break:break-word;line-height:1.3;}
.popup-box .prow{margin:3px 0;font-size:12px;color:#555;}
.popup-box .prow b{color:#222;}
.popup-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:bold;color:#fff;margin-top:5px;margin-right:4px;}
.pb-bought{background:#3ddc84;color:#000;}
.pb-notbought{background:#ff9a3c;color:#000;}
.pb-inactive{background:#aaa;}
.nav-btns{display:flex;gap:6px;margin-top:8px;}
.nav-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:8px 6px;border-radius:8px;font-size:12px;font-weight:600;color:#fff;text-decoration:none;}
.nav-btn-gmaps{background:#4285F4;}
.nav-btn-waze{background:#33CCFF;color:#1a1a1a;}
</style>
</head>
<body>

<div id="auth-overlay">
  <h2>📍 DEBTOR MAP</h2>
  <p>Session expired or not logged in.<br>Please log in to the dashboard first.</p>
  <a href="sales_dashboard.html">Go to Dashboard →</a>
</div>

<div id="loading">
  <div class="spinner"></div>
  <h2>DEBTOR MAP</h2>
  <p id="load-msg">Checking session...</p>
</div>

<div id="header">
  <div>
    <div class="sub">Miracle Group</div>
    <h1>📍 DEBTOR MAP</h1>
  </div>
  <div style="display:flex;align-items:center;gap:8px;">
    <span id="stats"></span>
    <span class="agent-badge" id="agent-badge"></span>
    <button class="theme-btn" onclick="toggleTheme()">☀</button>
  </div>
</div>

<!-- Agent legend -->
<div id="legend-bar">
  <div class="leg"><div class="leg-dot" style="background:#3ddc84;"></div>Bought this month</div>
  <div class="leg"><div class="leg-dot" style="background:#ff9a3c;"></div>Not yet bought</div>
  <div class="leg"><div class="leg-dot" style="background:#aaaaaa;opacity:.5"></div>Inactive</div>
</div>

<!-- Agent day route strip -->
<div id="day-strip"></div>

<!-- Admin controls -->
<div id="controls">
  <div id="search-row">
    <input id="search" type="search" placeholder="Search debtor name or code...">
    <button id="clear-btn" onclick="clearFilters()">Reset</button>
  </div>
  <div class="filter-row" id="day-row">
    <span class="filter-label">Day</span>
    <button class="all-btn active" data-day="ALL" onclick="toggleDay(this)">All</button>
  </div>
  <div class="filter-row">
    <span class="filter-label">Show</span>
    <button class="toggle-btn on-g" id="btn-bought"    onclick="toggleFilter('bought')"   >✓ Bought</button>
    <button class="toggle-btn on-o" id="btn-notbought" onclick="toggleFilter('notbought')">⚠ Not Yet</button>
    <button class="toggle-btn on-r" id="btn-inactive"  onclick="toggleFilter('inactive')" >✗ Inactive</button>
    <div id="admin-agent-wrap" style="margin-left:auto;display:none;">
      <select class="agent-select" id="admin-agent-select" onchange="applyFilters()">
        <option value="ALL">All Agents</option>
      </select>
    </div>
  </div>
</div>

<div id="map"></div>

<nav class="bottom-nav" id="bottom-nav">
  <a class="nav-item" href="sales_dashboard.html"><div class="nav-icon">👥</div><div class="nav-label">Dashboard</div></a>
  <a class="nav-item active" href="debtor_map.html"><div class="nav-icon">📍</div><div class="nav-label">Map</div></a>
</nav>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
const SUPABASE_URL = 'https://rqitgmydcbyiygqjssrb.supabase.co';
const SUPABASE_KEY = 'sb_publishable_8xb7ZaHyr3OF3WNEqufuDg_67spOIFw';
const IS_ADMIN     = 'GT138888';

const DAYS_ORDER = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday','Random'];
const DAY_COLORS = {
  Monday:'#e74c3c', Tuesday:'#e67e22', Wednesday:'#27ae60',
  Thursday:'#4da6ff', Friday:'#a78bfa', Saturday:'#16a085',
  Sunday:'#f0c040',  Random:'#7070a0'
};
const DAY_JS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const TODAY  = DAY_JS[new Date().getDay()];

// Theme
const savedTheme = localStorage.getItem('md_dashboard_theme') || 'dark';
if (savedTheme === 'light') document.documentElement.setAttribute('data-theme','light');
function toggleTheme() {
  const next = document.documentElement.getAttribute('data-theme') === 'light' ? '' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('md_dashboard_theme', next || 'dark'); } catch {}
}

let showBought = true, showNotBought = true, showInactive = true;
let activeDays = new Set(['ALL', ...DAYS_ORDER]);
let searchTerm = '', allMarkers = [], clusterGroup;
let currentAgent = null, isAdmin = false;
// Agent day filter (single day)
let agentDayFilter = 'ALL';

const map = L.map('map').setView([5.85, 102.05], 10);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors', maxZoom: 19
}).addTo(map);

function setLoadMsg(t) { document.getElementById('load-msg').textContent = t; }

// ── Pin design ───────────────────────────────────────────────────────────────
// Fill = purchase status | Ring = day color
function makeIcon(day, active, purchased) {
  const ring  = DAY_COLORS[day] || '#7070a0';
  let fill, op, cross = '';
  if (!active || active === 'Unchecked') {
    fill = '#aaaaaa'; op = '0.4';
    cross = '<line x1="5" y1="5" x2="19" y2="19" stroke="#fff" stroke-width="2.5"/><line x1="19" y1="5" x2="5" y2="19" stroke="#fff" stroke-width="2.5"/>';
  } else if (purchased === null) {
    fill = ring; op = '1';        // no purchase data yet — use day colour
  } else if (purchased) {
    fill = '#3ddc84'; op = '1';   // green = bought
  } else {
    fill = '#ff9a3c'; op = '1';   // orange = not yet bought
  }
  return L.divIcon({
    html:`<svg xmlns="http://www.w3.org/2000/svg" width="28" height="36" viewBox="0 0 28 36">
      <path d="M14 0C6.3 0 0 6.3 0 14c0 10 14 22 14 22S28 24 28 14C28 6.3 21.7 0 14 0z" fill="${ring}"/>
      <path d="M14 2C7.4 2 2 7.4 2 14c0 9 12 20 12 20S26 23 26 14C26 7.4 20.6 2 14 2z" fill="${fill}" opacity="${op}"/>
      <circle cx="14" cy="14" r="6" fill="#fff" opacity="${op}"/>
      ${cross}
    </svg>`,
    iconSize:[28,36], iconAnchor:[14,36], popupAnchor:[0,-34], className:''
  });
}

function buildClusterGroup() {
  return L.markerClusterGroup({
    maxClusterRadius:55, spiderfyOnMaxZoom:true, showCoverageOnHover:false, zoomToBoundsOnClick:true,
    iconCreateFunction(c) {
      const n = c.getChildCount(), sz = n<10?34:n<100?40:48;
      return L.divIcon({
        html:`<div style="background:rgba(240,192,64,.9);color:#000;border-radius:50%;width:${sz}px;height:${sz}px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:${n<10?13:11}px;border:2px solid rgba(255,255,255,.5);box-shadow:0 2px 8px rgba(0,0,0,.5);">${n}</div>`,
        iconSize:[sz,sz], className:''
      });
    }
  });
}

function addMarkers(records) {
  clusterGroup = buildClusterGroup();
  records.forEach(r => {
    const isActive   = r.active === 'Checked';
    const purchased  = r.purchased ?? null; // Bug 2 fix: keep null/true/false as-is
    const m = L.marker([r.lat, r.lng], {icon: makeIcon(r.day, r.active, purchased)});
    const dc  = DAY_COLORS[r.day] || '#7070a0';
    const ph  = r.phone ? `<a href="tel:${r.phone}" style="color:#4da6ff;font-weight:600;text-decoration:none;">${r.phone}</a>` : '-';
    const ctnBadge = !isActive
      ? `<span class="popup-badge pb-inactive">✗ Inactive</span>`
      : purchased === null
        ? `<span class="popup-badge" style="background:#7070a0;">No data</span>`
        : purchased
          ? `<span class="popup-badge pb-bought">✓ Bought ${r.ctn_cur > 0 ? r.ctn_cur+' ctn' : ''}</span>`
          : `<span class="popup-badge pb-notbought">⚠ Not Yet Bought</span>`;
    const lpDate = r.last_purchase ? `<div class="prow"><b>Last Purchase:</b> ${r.last_purchase}</div>` : '';
    const gm = `https://www.google.com/maps/dir/?api=1&destination=${r.lat},${r.lng}`;
    const wz = `https://waze.com/ul?ll=${r.lat},${r.lng}&navigate=yes`;
    m.bindPopup(`
      <div class="popup-box">
        <div class="pname">${r.name||r.code}</div>
        <div class="prow"><b>Code:</b> ${r.code}</div>
        <div class="prow"><b>Agent:</b> ${r.agent}</div>
        <div class="prow"><b>Visit Day:</b> <span style="color:${dc};font-weight:600;">${r.day}</span></div>
        <div class="prow"><b>Area:</b> ${r.area}</div>
        <div class="prow"><b>Phone:</b> ${ph}</div>
        ${lpDate}
        <div style="margin-top:4px;">${ctnBadge}</div>
        <div class="nav-btns">
          <a class="nav-btn nav-btn-gmaps" href="${gm}" target="_blank">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="#fff"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
            Google Maps
          </a>
          <a class="nav-btn nav-btn-waze" href="${wz}" target="_blank">
            <svg width="13" height="13" viewBox="0 0 32 32"><ellipse cx="16" cy="18" rx="13" ry="11" fill="#1a1a1a"/><circle cx="10" cy="23" r="3" fill="#fff"/><circle cx="22" cy="23" r="3" fill="#fff"/><path d="M9 14 Q16 8 23 14" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
            Waze
          </a>
        </div>
      </div>`, {maxWidth:280});
    m._data = r;
    m._isActive = isActive;
    m._purchased = purchased;
    allMarkers.push(m);
  });
  map.addLayer(clusterGroup);
}

// ── Agent day strip ─────────────────────────────────────────────────────────
function buildDayStrip(records) {
  const strip = document.getElementById('day-strip');
  strip.style.display = 'flex';
  const days = DAYS_ORDER.filter(d => records.some(r => r.day === d));
  // ALL button
  const allBtn = document.createElement('button');
  allBtn.className = 'day-strip-btn active';
  allBtn.dataset.day = 'ALL';
  allBtn.style.cssText = '--dc:#7070a0';
  allBtn.textContent = 'All Days';
  allBtn.onclick = () => setAgentDay('ALL', allBtn);
  strip.appendChild(allBtn);

  days.forEach(d => {
    const btn = document.createElement('button');
    btn.className = 'day-strip-btn' + (d === TODAY ? ' today-btn' : '');
    btn.dataset.day = d;
    btn.style.cssText = `--dc:${DAY_COLORS[d]}`;
    btn.textContent = d + (d === TODAY ? ' · Today' : '');
    btn.onclick = () => setAgentDay(d, btn);
    strip.appendChild(btn);
  });

  // Auto-select today if agent has visits today
  if (days.includes(TODAY)) {
    const todayBtn = strip.querySelector(`[data-day="${TODAY}"]`);
    if (todayBtn) setAgentDay(TODAY, todayBtn);
  }
}

function setAgentDay(day, btn) {
  agentDayFilter = day;
  document.querySelectorAll('.day-strip-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  applyFilters();
}

// ── Admin day buttons ───────────────────────────────────────────────────────
function buildAdminDayButtons(records) {
  const present = new Set(records.map(r => r.day));
  const row = document.getElementById('day-row');
  DAYS_ORDER.forEach(d => {
    if (!present.has(d)) return;
    const btn = document.createElement('button');
    btn.className = 'day-btn active';
    btn.dataset.day = d;
    btn.style.cssText = `--dc:${DAY_COLORS[d]||'#555'}`;
    btn.textContent = d.slice(0,3);
    btn.onclick = () => toggleDay(btn);
    row.appendChild(btn);
  });
}

function buildAdminDropdown(records) {
  const agents = [...new Set(records.map(r => r.agent))].filter(Boolean).sort();
  const sel = document.getElementById('admin-agent-select');
  agents.forEach(a => { const o=document.createElement('option'); o.value=o.textContent=a; sel.appendChild(o); });
  document.getElementById('admin-agent-wrap').style.display = 'block';
}

// ── Filters ─────────────────────────────────────────────────────────────────
function applyFilters() {
  if (!clusterGroup) return; // Bug 1 fix: guard before clusterGroup is ready
  searchTerm = isAdmin ? document.getElementById('search').value.trim().toLowerCase() : '';
  const agentF = isAdmin ? document.getElementById('admin-agent-select').value : currentAgent;
  const allOn  = activeDays.has('ALL');

  clusterGroup.clearLayers();
  let shown = 0, bought = 0, notBought = 0;

  allMarkers.forEach(m => {
    const r = m._data;
    const dayMatch   = isAdmin ? (allOn || activeDays.has(r.day)) : (agentDayFilter === 'ALL' || r.day === agentDayFilter);
    const agentMatch = agentF === 'ALL' || r.agent === agentF;
    // Bug 3 fix: null purchase = no data yet, always show regardless of toggle
    const boughtMatch = (m._purchased === null) ||
      (m._purchased === true  && showBought) ||
      (m._purchased === false && m._isActive && showNotBought) ||
      (!m._isActive && showInactive);
    const srchMatch  = !searchTerm || r.name.toLowerCase().includes(searchTerm) || r.code.toLowerCase().includes(searchTerm);
    if (dayMatch && agentMatch && boughtMatch && srchMatch) {
      clusterGroup.addLayer(m); shown++;
      if (m._isActive && m._purchased === true) bought++;
      else if (m._isActive && m._purchased === false) notBought++;
    }
  });
  map.addLayer(clusterGroup);

  if (isAdmin) {
    document.getElementById('stats').textContent = `${shown.toLocaleString()} debtors`;
  } else {
    const nb = notBought > 0 ? ` · ⚠ ${notBought} not yet` : '';
    document.getElementById('stats').textContent = `${shown} shown · ✓ ${bought}${nb}`;
  }
}

function toggleDay(btn) {
  const day = btn.dataset.day;
  if (day === 'ALL') {
    const allOn = activeDays.has('ALL');
    activeDays = allOn ? new Set() : new Set(['ALL',...DAYS_ORDER]);
    document.querySelectorAll('.day-btn,.all-btn').forEach(b => b.classList.toggle('active',!allOn));
  } else {
    if (activeDays.has(day)) {
      activeDays.delete(day); activeDays.delete('ALL');
      btn.classList.remove('active');
      document.querySelector('[data-day="ALL"]').classList.remove('active');
    } else {
      activeDays.add(day); btn.classList.add('active');
      const dayBtns = [...document.querySelectorAll('.day-btn')];
      if (dayBtns.every(b => activeDays.has(b.dataset.day))) {
        activeDays.add('ALL');
        document.querySelector('[data-day="ALL"]').classList.add('active');
      }
    }
  }
  applyFilters();
}

function toggleFilter(type) {
  if (type==='bought')    { showBought    = !showBought;    document.getElementById('btn-bought').className    = 'toggle-btn '+(showBought    ?'on-g':'off-g'); }
  if (type==='notbought') { showNotBought = !showNotBought; document.getElementById('btn-notbought').className = 'toggle-btn '+(showNotBought ?'on-o':'off-o'); }
  if (type==='inactive')  { showInactive  = !showInactive;  document.getElementById('btn-inactive').className  = 'toggle-btn '+(showInactive  ?'on-r':'off-r'); }
  applyFilters();
}

function clearFilters() {
  document.getElementById('search').value = '';
  document.getElementById('admin-agent-select').value = 'ALL';
  showBought = true; showNotBought = true; showInactive = true;
  activeDays = new Set(['ALL',...DAYS_ORDER]);
  document.querySelectorAll('.day-btn,.all-btn').forEach(b => b.classList.add('active'));
  document.getElementById('btn-bought').className    = 'toggle-btn on-g';
  document.getElementById('btn-notbought').className = 'toggle-btn on-o';
  document.getElementById('btn-inactive').className  = 'toggle-btn on-r';
  applyFilters();
}

let st;
document.getElementById('search').addEventListener('input', () => { clearTimeout(st); st=setTimeout(applyFilters,300); });

// ── Supabase fetch ───────────────────────────────────────────────────────────
const PAGE = 1000;
async function fetchPage(agentName, cols, from) {
  let url = `${SUPABASE_URL}/rest/v1/debtor_locations?select=${cols}&order=code`;
  if (agentName !== 'ALL') url += `&agent=eq.${encodeURIComponent(agentName)}`;
  return fetch(url, {
    headers:{ 'apikey':SUPABASE_KEY, 'Authorization':`Bearer ${SUPABASE_KEY}`,
              'Range-Unit':'items', 'Range':`${from}-${from+PAGE-1}` }
  });
}

async function fetchDebtors(agentName) {
  // Try with purchase columns first; fall back to base columns if they don't exist yet
  const FULL_COLS = 'code,name,phone,agent,day,active,area,lat,lng,purchased,ctn_cur,last_purchase';
  const BASE_COLS = 'code,name,phone,agent,day,active,area,lat,lng';

  let useFull = true;
  // Quick probe to check columns exist
  const probe = await fetchPage(agentName, FULL_COLS, 0);
  if (!probe.ok) {
    const txt = await probe.text();
    if (txt.includes('PGRST204') || txt.includes('column') || probe.status === 400) {
      useFull = false;
    } else {
      throw new Error(`Supabase ${probe.status}: ${txt}`);
    }
  }

  const cols = useFull ? FULL_COLS : BASE_COLS;
  let all = [], from = 0;

  // If probe succeeded, use those rows
  if (useFull) {
    const rows = await probe.json();
    all = rows;
    if (rows.length < PAGE) return all;
    from = PAGE;
  }

  while (true) {
    const r = await fetchPage(agentName, cols, from);
    if (!r.ok) throw new Error(`Supabase ${r.status}: ${await r.text()}`);
    const rows = await r.json();
    all = all.concat(rows);
    if (rows.length < PAGE) break;
    from += PAGE;
  }

  // Normalise missing purchase fields
  if (!useFull) all.forEach(r => { r.purchased = null; r.ctn_cur = null; r.last_purchase = null; });
  return all;
}

// ── Boot ─────────────────────────────────────────────────────────────────────
async function boot() {
  const auth  = sessionStorage.getItem('md_auth');
  const agent = sessionStorage.getItem('md_agent');

  if (auth !== '1' || !agent) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('auth-overlay').style.display = 'flex';
    return;
  }

  currentAgent = agent;
  isAdmin = (agent === IS_ADMIN);
  document.getElementById('agent-badge').textContent = isAdmin ? 'ADMIN' : agent;

  if (!isAdmin) {
    document.getElementById('controls').style.display = 'none';
    document.getElementById('header').classList.add('agent-mode');
    document.getElementById('legend-bar').style.display = 'flex';
  }

  try {
    setLoadMsg(isAdmin ? 'Fetching all debtors...' : `Loading your debtors, ${agent}...`);
    const records = await fetchDebtors(isAdmin ? 'ALL' : agent);

    setLoadMsg(`Building map — ${records.length} debtors...`);
    addMarkers(records); // Bug 1 fix: must run before buildDayStrip so clusterGroup exists
    if (isAdmin) {
      buildAdminDayButtons(records);
      buildAdminDropdown(records);
    } else {
      buildDayStrip(records); // may call applyFilters via setAgentDay — safe now
    }
    applyFilters();
    document.getElementById('loading').style.display = 'none';
  } catch(e) {
    setLoadMsg('Error: ' + e.message);
    console.error(e);
  }
}

boot();
</script>
