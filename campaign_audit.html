<script>
const AGENTS = ['BEN','CJ','JACKY','JAMES','JW','KEAN','KEE','KF','KI-MI','KW','LEON','NMK','SAM','XIAN','YI'];
const CAMP_EMOJI = {free_sample:'ðŸŽ',foc_sample:'ðŸŽ',birthday_gift:'ðŸŽ‚',promotion:'ðŸ“¢',festive_gift:'ðŸ§§',voucher:'ðŸŽŸï¸',conversion_tiered:'ðŸŽ¯',conversion_simple:'ðŸŽ¯',other:'ðŸ“‹'};
const CAMP_LABEL = {free_sample:'FOC Sample',foc_sample:'FOC Sample',birthday_gift:'Birthday Gift',promotion:'Brand Promo',festive_gift:'Festive Gift',conversion_tiered:'Conversion',conversion_simple:'Conversion',other:'Other'};

let DASH_DATA  = null;   // current month data
let CAMP_DATA  = null;   // campaigns.json
function auditCampFromUrl() {
  try {
    const params = new URLSearchParams(window.location.search || '');
    const raw = String(params.get('camp') || params.get('view') || params.get('tab') || '').trim();
    if (/^(bday|birthday|birthday_list|bday_list)$/i.test(raw)) return 'BDAY_LIST';

let activeCampId = auditCampFromUrl();

let _lastBirthdayAuditState = null;
let _lastBirthdayImportPlan = null;

// Supabase config (same as admin / sales_dashboard)
const SUPABASE_URL = 'https://rqitgmydcbyiygqjssrb.supabase.co';
const SUPABASE_KEY = 'sb_publishable_8xb7ZaHyr3OF3WNEqufuDg_67spOIFw';

// In-memory caches populated from Supabase on load
// Key format: `${agent}|${campId}|${debtorCode}`
let CLAIMS_CACHE = {};  // value: claim row from Supabase
let AUDIT_CACHE  = {};  // value: audit row derived from claim.status
let FLAGS_CACHE  = [];  // raw rows from Supabase flags table

// Mirrors process_data.py's _campaign_active_in_month and the JS helper
// already in sales_dashboard.html. Returns true if a campaign was active
// (started before/in monthStr AND not yet ended by monthStr's start) for
// a given month string like "May 26".
function isCampaignActiveInMonth(camp, monthStr) {
  if (!monthStr) return true;
  const MONTHS_C = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const today = new Date().toISOString().slice(0, 7);
  const start = camp.start_date || camp.created_at || '';
  const deadline = camp.deadline || '';

  // Real-world start gate: a campaign that hasn't started yet in real time
  // shouldn't appear regardless of which month is selected.
  if (start && start.slice(0,7) > today) return false;

  // Selected month gate: campaign must have started by this month and
  // must not have ended before the selected month begins.
  const parts = monthStr.split(' ');
  if (parts.length === 2) {
    const m = MONTHS_C.indexOf(parts[0]) + 1;
    const y = 2000 + parseInt(parts[1]);
    if (m && y) {
      const monthIso = `${y}-${String(m).padStart(2,'0')}`;
      if (start && start.slice(0,7) > monthIso) return false;
      if (deadline && deadline.slice(0,7) < monthIso) return false;
    }
  }
  return true;
}

// Populate month-select with a rolling range of months.
// Generates options from Jan 26 through (current real-world month + 6).
// Default-selects current real-world month if available, otherwise latest.
// Mirrors the admin.html pattern (commit 738a40a / 5cfadda).
function populateAuditMonthDropdown() {
  if (window.MDAdminContext) {
    const el = document.getElementById('month-select');
    if (!el) return;
    const preferred = MDAdminContext.getWorkingMonth(el.value);
    const { opts, defaultSel } = MDAdminContext.monthOptions({ include: [el.value], preferred });
    const selected = opts.includes(preferred) ? preferred : defaultSel;
    el.innerHTML = opts.map(o => `<option value="${o}"${o === selected ? ' selected' : ''}>${o}</option>`).join('');
    MDAdminContext.setWorkingMonth(selected, { silent: true });
    return;
  }
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const START_YEAR = 2026;
  const START_MONTH = 0;
  const FUTURE_BUFFER = 6;

  const today = new Date();
  const tYear = today.getFullYear();
  const tMonth = today.getMonth();

  const opts = [];
  let y = START_YEAR, m = START_MONTH;
  while (y < tYear || (y === tYear && m <= tMonth + FUTURE_BUFFER)) {
    opts.push(`${MONTHS[m]} ${String(y).slice(-2)}`);
    m++;
    if (m > 11) { m = 0; y++; }
    if (opts.length > 200) break;
  }

  const todayLabel = `${MONTHS[tMonth]} ${String(tYear).slice(-2)}`;
  const defaultSel = opts.includes(todayLabel) ? todayLabel : opts[opts.length - 1];

  const el = document.getElementById('month-select');
  if (!el) return;
  const previouslySelected = el.value;
  el.innerHTML = opts.map(o =>
    `<option value="${o}"${o === defaultSel ? ' selected' : ''}>${o}</option>`
  ).join('');
  if (previouslySelected && opts.includes(previouslySelected)) {

async function fetchAllClaimsForMonth(month) {
  // Fetch paginated â€” up to 5000 rows total (plenty for one month)
  const all = [];
  let offset = 0;
  while (offset < 5000) {
    const url = `${SUPABASE_URL}/rest/v1/claims?select=*&month=eq.${encodeURIComponent(month)}&order=ts.asc`;
    const r = await fetch(url, {
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Range': `${offset}-${offset+999}`
      }
    });
    if (!r.ok) { console.warn('[audit] fetch failed', r.status); break; }
    const batch = await r.json();
    if (!batch || !batch.length) break;
    all.push(...batch);
    if (batch.length < 1000) break;
    offset += 1000;
  }
  return all;
}

async function fetchAllFlagsForMonth(month) {
  const all = [];

    const url = `${SUPABASE_URL}/rest/v1/flags?select=*&month=eq.${encodeURIComponent(month)}&order=ts.asc`;

  }

}

async function fetchSupabasePaged(path, label, maxRows) {
  const all = [];
  const pageSize = 1000;
  const limit = maxRows || 50000;
  for (let offset = 0; offset < limit; offset += pageSize) {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Range-Unit': 'items',
        'Range': `${offset}-${offset + pageSize - 1}`,
        'Prefer': 'count=none'
      }
    });
    if (!r.ok) throw new Error(`${label || path} ${r.status}`);
    const batch = await r.json();
    if (!Array.isArray(batch) || !batch.length) break;
    all.push(...batch);
    if (batch.length < pageSize) break;
  }
  return all;
}

function auditGroupBy(rows, key) {
  return (rows || []).reduce((acc, row) => {
    const groupKey = row?.[key];
    if (!groupKey) return acc;
    (acc[groupKey] ||= []).push(row);
    return acc;
  }, {});
}

function auditParseCampaignNotes(notes) {
  if (!notes) return {};
  if (typeof notes === 'object' && !Array.isArray(notes)) return notes;
  try {
    const parsed = JSON.parse(notes);
    return parsed && typeof parsed === 'object' && !Array.isArray(parsed) ? parsed : { notes };
  } catch (_) {
    return { notes };
  }
}

function auditMergeCampaignData(generated, live) {
  const merged = { ...(generated || {}), campaigns: [] };
  const seen = new Set();
  (live?.campaigns || []).forEach(camp => {
    if (!camp?.id || seen.has(camp.id)) return;
    merged.campaigns.push(camp);
    seen.add(camp.id);
  });
  (generated?.campaigns || []).forEach(camp => {
    if (!camp?.id || seen.has(camp.id)) return;
    merged.campaigns.push(camp);
    seen.add(camp.id);
  });
  return merged;
}

// Populate CLAIMS_CACHE and AUDIT_CACHE from Supabase rows
function normalizeAuditClaimStage(stage) {
  const n = Number(stage || 1);
  return n === 2 ? 2 : 1;
}

function auditClaimStageLabel(stage) {
  return normalizeAuditClaimStage(stage) === 2 ? 'RP OD' : '1ST OD';
}

function parseAuditClaimKey(key) {
  const parts = String(key || '').split('|');
  return {
    agent: parts[0] || '',
    campId: parts[1] || '',
    debtorCode: parts[2] || '',
    stage: normalizeAuditClaimStage(parts[3])
  };
}

function indexSupabaseRows(rows) {
  CLAIMS_CACHE = {};
  AUDIT_CACHE = {};
  rows.forEach(r => {
    const stage = normalizeAuditClaimStage(r.stage);
    const key = getClaimKey('', r.agent, r.camp_id, r.debtor_code, stage);
    // Claim shape used by rest of this file
    CLAIMS_CACHE[key] = {
      ts: r.ts,
      count: 1,
      remark: r.remark || '',
      bulk: !!r.bulk,
      status: r.status,                      // raw status â€” needed for excluded filtering
      reason: r.reason || '',                // exclusion reason
      actor: r.actor || 'agent',
      campType: r.camp_type || null,
      stage
    };
    // Audit shape derived from status
    if (r.status === 'verified' || r.status === 'processed') {
      AUDIT_CACHE[key] = { status: 'verified', ts: r.audit_ts || r.ts, by: r.audit_by || 'management' };
    } else if (r.status === 'rejected') {
      AUDIT_CACHE[key] = { status: 'rejected', ts: r.audit_ts || r.ts, by: r.audit_by || 'management', reason: r.audit_reason || '' };
    }
    // status === 'submitted' / legacy delivered / claimed -> pending request (no audit entry)
    // status === 'excluded' â†’ agent-initiated exclusion, not a thing admin audits
  });
}

// â”€â”€ Storage helpers (now backed by Supabase cache, not localStorage) â”€â”€â”€â”€â”€â”€â”€
function getClaimKey(month, agent, campId, debtorCode, stage = 1) {
  return `${agent}|${campId}|${(debtorCode||'').toUpperCase()}|${normalizeAuditClaimStage(stage)}`;
}
function getClaim(month, agent, campId, debtorCode, stage = 1) {
  return CLAIMS_CACHE[getClaimKey(month, agent, campId, debtorCode, stage)] || null;
}
function getAuditKey(month, agent, campId, debtorCode, stage = 1) {
  return `${agent}|${campId}|${(debtorCode||'').toUpperCase()}|${normalizeAuditClaimStage(stage)}`;
}
function getAudit(month, agent, campId, debtorCode, stage = 1) {
  return AUDIT_CACHE[getAuditKey(month, agent, campId, debtorCode, stage)] || null;
}

function auditClaimCategory(claim, audit) {
  const unclaimedStatuses = new Set([
    'unclaimed',
    'withdrawn',
    'withdraw',
    'removed',
    'deleted',
    'cancelled',
    'canceled',
    'not_requested',
    'not-requested'
  ]);
  const auditStatus = String(audit?.status || '').toLowerCase();
  const claimStatus = String(claim?.status || '').toLowerCase();
  if (auditStatus === 'verified' || auditStatus === 'processed' || claimStatus === 'verified' || claimStatus === 'processed') return 'verified';
  if (auditStatus === 'rejected' || claimStatus === 'rejected') return 'rejected';
  if (!claim || unclaimedStatuses.has(claimStatus)) return 'unclaimed';
  if (claimStatus === 'excluded') return 'excluded';
  return 'pending';
}

function auditClaimIsManagerOff(claim) {
  const actor = String(claim?.actor || '').toLowerCase();
  return String(claim?.status || '').toLowerCase() === 'excluded'
    && (actor === 'management_bulk_off' || actor === 'campaign_audit_bulk_off' || actor === 'management_off');
}

function campaignAuditBulkReasonLabel(reason) {
  return ({
    wrong_account: 'Wrong account',
    duplicate: 'Duplicate debtor',
    closed: 'Shop closed',
    not_eligible: 'Not eligible',
    wrong_agent: 'Assigned to wrong agent',
    management_decision: 'Management decision',
    other: 'Other'
  })[reason] || reason || 'Management decision';
}

function campaignAuditBulkClaimData(mode, opts) {
  opts = opts || {};
  const ts = opts.ts || new Date().toISOString();
  const campType = opts.campType || opts.camp_type || null;
  if (mode === 'remove') {
    const reason = opts.reason || 'management_decision';
    const label = campaignAuditBulkReasonLabel(reason);
    const notes = String(opts.remark || '').trim();
    const batch = opts.batchId ? ` [${opts.batchId}]` : '';
    return {
      ts,
      count: 1,
      remark: `Manager off: ${label}${notes ? ' - ' + notes : ''}${batch}`,
      bulk: true,
      status: 'excluded',
      actor: 'management_bulk_off',
      reason,
      campType
    };
  }
  return {
    ts,
    count: 1,
    remark: 'Bulk import - delivered earlier',
    bulk: true,
    status: 'verified',
    actor: 'campaign_audit_bulk',
    campType
  };
}

function campaignAuditBulkSelectionState(claim, audit, mode) {
  const category = auditClaimCategory(claim, audit);
  if (mode === 'remove') {
    if (category === 'unclaimed') return { canSelect: true, label: '' };
    if (category === 'excluded') return { canSelect: false, label: 'Already off' };
    if (category === 'verified') return { canSelect: false, label: 'Already processed' };
    if (category === 'pending') return { canSelect: false, label: 'Request already sent' };
    return { canSelect: false, label: 'Already audited' };
  }
  return category === 'unclaimed'
    ? { canSelect: true, label: '' }
    : { canSelect: false, label: 'Already marked' };
}

function campaignAuditBulkAgentOptions(mode, agents) {
  const cleanAgents = (agents || []).filter(Boolean);
  const mapped = cleanAgents.map(agent => ({ value: agent, label: agent }));
  if (mode === 'remove') return [{ value: 'ALL', label: 'All Agents' }, ...mapped];
  return [{ value: '', label: '-- Select Agent --' }, ...mapped];
}

function campaignAuditBulkSelectedEntries(checkboxes, fallbackAgent) {
  return Array.from(checkboxes || []).map(cb => ({
    agent: cb?.dataset?.agent || fallbackAgent || '',
    debtorCode: String(cb?.dataset?.code || cb?.value || '').trim().toUpperCase()
  })).filter(entry => entry.agent && entry.debtorCode);
}

function campaignAuditBulkCodeKeys(code) {
  const full = String(code || '').trim().toUpperCase().replace(/\s+/g, '');
  if (!full) return [];
  const keys = [full];
  const short = full.includes('-') ? full.split('-').pop() : '';
  if (short && short !== full) keys.push(short);
  return [...new Set(keys)];
}

// Persist an audit decision to Supabase (UPDATE claims.status)
async function saveAudit(month, agent, campId, debtorCode, auditData, stage = 1) {
  const cleanStage = normalizeAuditClaimStage(stage || auditData?.stage);
  const key = getAuditKey(month, agent, campId, debtorCode, cleanStage);

  // Update in-memory caches immediately (optimistic UI)
  if (auditData.status === 'undo' || auditData.status === null) {
    delete AUDIT_CACHE[key];
  } else {
    AUDIT_CACHE[key] = { ...auditData };
  }

  // Determine target status for Supabase
  let newStatus;
  if (!auditData.status || auditData.status === 'undo') newStatus = 'submitted';
  else if (auditData.status === 'verified') newStatus = 'verified';
  else if (auditData.status === 'rejected') newStatus = 'rejected';
  else newStatus = 'submitted';

  // Build body â€” only send columns that are certain to exist.
  // Audit metadata is optional (column may not exist yet).
  // Core signal: status. Always include.
  const body = { status: newStatus };
  // Optional: include audit metadata if columns exist (will be silently dropped if not)
  if (auditData.ts) body.audit_ts = auditData.ts;
  if (auditData.by) body.audit_by = auditData.by;
  if (auditData.reason) body.audit_reason = auditData.reason;

  const url = `${SUPABASE_URL}/rest/v1/claims`
    + `?month=eq.${encodeURIComponent(month)}`
    + `&agent=eq.${encodeURIComponent(agent)}`
    + `&camp_id=eq.${encodeURIComponent(campId)}`
    + `&debtor_code=eq.${encodeURIComponent(debtorCode)}`
    + `&stage=eq.${cleanStage}`;

  try {
    let r = await fetch(url, {
      method: 'PATCH',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify(body)
    });
    // If audit columns don't exist, retry with status only
    if (!r.ok && (body.audit_ts || body.audit_by || body.audit_reason)) {
      console.warn('[audit] retrying with status-only (audit columns may not exist)');
      r = await fetch(url, {
        method: 'PATCH',
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify({ status: newStatus })
      });
    }
    if (!r.ok) {
      const err = await r.text();
      console.warn('[audit] Supabase update failed', r.status, err);
      showToast(`âœ— Save failed: ${r.status}`);
      return false;
    }
    return true;
  } catch(e) {
    console.warn('[audit] Supabase error', e);
    showToast('âœ— Network error');
    return false;
  }
}

// â”€â”€ Load data â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
async function loadAuditData() {
  const month = document.getElementById('month-select').value;
  if (window.MDAdminContext && month) MDAdminContext.setWorkingMonth(month, { silent: true });
  const slug  = month.toLowerCase().replace(' ','');

  // Show loading state
  document.getElementById('audit-content').innerHTML = '<div class="empty">â³ Loading from Supabase...</div>';

  try {
    const r = await fetch(`data_${slug}.json?v=${Date.now()}`);
    if (!r.ok) throw new Error(`data_${slug}.json ${r.status}`);
    DASH_DATA = await r.json();
  } catch(e) {
    // Future/current audit months may not have a data_<month>.json yet.
    // Fall back to dashboard_data.json, which carries birthday_by_month.
    try {
      const fallback = await fetch(`dashboard_data.json?v=${Date.now()}`);
      if (!fallback.ok) throw new Error(`dashboard_data.json ${fallback.status}`);
      DASH_DATA = await fallback.json();
    } catch(e2) {
      DASH_DATA = null;
    }
  }
  let generatedCampaignData = null;
  try {
    const r2 = await fetch(`campaigns.json?v=${Date.now()}`);
    generatedCampaignData = await r2.json();
  } catch(e) { generatedCampaignData = null; }

  try {
    const liveCampaignData = await fetchLiveCampaignData();
    CAMP_DATA = auditMergeCampaignData(generatedCampaignData, liveCampaignData);
    console.log(`[audit] Loaded ${liveCampaignData.campaigns.length} live Supabase campaigns`);
  } catch(e) {
    console.warn('[audit] Failed to load live Supabase campaigns; using generated fallback', e);
    CAMP_DATA = generatedCampaignData;
  }

  // If the previously-selected campaign tab is no longer valid for this
  // month, reset to ALL so the UI shows something rather than nothing.
  if (activeCampId !== 'ALL' && activeCampId !== 'BDAY_LIST' && activeCampId !== 'FLAGS_LIST') {
    const stillActive = (CAMP_DATA?.campaigns || [])
      .some(c => c.id === activeCampId && c.active && isCampaignActiveInMonth(c, month));
    if (!stillActive) {
      activeCampId = 'ALL';
    }
  }

  // Pull claims + audit state from Supabase
  try {
    const rows = await fetchAllClaimsForMonth(month);
    indexSupabaseRows(rows);
    console.log(`[audit] Loaded ${rows.length} Supabase claims for ${month}`);
  } catch(e) {
    console.warn('[audit] Failed to load Supabase claims', e);
    CLAIMS_CACHE = {};
    AUDIT_CACHE = {};
  }
  try {
    FLAGS_CACHE = await fetchAllFlagsForMonth(month);
    console.log(`[audit] Loaded ${FLAGS_CACHE.length} Supabase flags for ${month}`);
  } catch(e) {
    console.warn('[audit] Failed to load Supabase flags', e);
    FLAGS_CACHE = [];
  }

  buildCampTabs();
  renderAudit();
}

// Driven by Supabase claims (CLAIMS_CACHE). Shows ALL claims that exist,
// including bulk-imported ones, not just pre-assigned campaign entries.
function renderFlagAudit() {
  const month = document.getElementById('month-select').value;
  const agentSel = document.getElementById('agent-select').value;
  const rows = (FLAGS_CACHE || [])
    .filter(f => agentSel === 'ALL' || f.agent === agentSel)
    .slice()
    .sort((a, b) =>
      String(a.agent || '').localeCompare(String(b.agent || '')) ||
      String(a.ts || '').localeCompare(String(b.ts || '')) ||
      String(a.debtor_code || '').localeCompare(String(b.debtor_code || ''))
    );

  const debtorByAgentCode = {};
  const debtorByCode = {};
  AGENTS.forEach(a => {
    const list = DASH_DATA?.agents?.[a]?.debtor_cards?.debtors || [];
    list.forEach(d => {
      const code = (d.debtor_code || '').toUpperCase();
      debtorByAgentCode[`${a}|${code}`] = d;
      if (!debtorByCode[code]) debtorByCode[code] = { debtor: d, owner: a };
    });
  });

  const reasonLabels = {
    cant_contact: "Can't Contact",
    close_account: 'Close Account Request',
    transfer: 'Transfer / Area Change',
    other: 'Other',
  };

  const byAgent = {};
  rows.forEach(row => {
    const ag = row.agent || 'UNKNOWN';
    if (!byAgent[ag]) byAgent[ag] = [];
    byAgent[ag].push(row);
  });

  _lastAuditExport = {
    mode: 'flags',
    campId: 'FLAGS_LIST',
    month,
    agent: agentSel,
    rows: rows.map(row => {
      const code = String(row.debtor_code || '').toUpperCase();
      const found = debtorByAgentCode[`${row.agent}|${code}`] || debtorByCode[code]?.debtor || {};
      return {
        agent: row.agent || '',
        debtor_code: code,
        debtor_name: found.company_name || code,
        reason: row.reason || '',
        note: row.note || row.remark || '',
        flagged_at: row.ts || row.flagged_at || '',
      };
    }),
  };

  document.getElementById('summary-row').innerHTML = `
    <div class="sum-card"><div class="sum-val r">${rows.length}</div><div class="sum-lbl">Open Flags</div></div>
    <div class="sum-card"><div class="sum-val b">${Object.keys(byAgent).length}</div><div class="sum-lbl">Agents</div></div>
    <div class="sum-card"><div class="sum-val a">${rows.filter(r=>r.reason==='close_account').length}</div><div class="sum-lbl">Close Requests</div></div>
    <div class="sum-card"><div class="sum-val b">${rows.filter(r=>r.reason==='transfer').length}</div><div class="sum-lbl">Transfers</div></div>`;

  if (!rows.length) {
    document.getElementById('audit-content').innerHTML = `<div class="empty">No open debtor flags for ${auditHtml(month)}</div>`;
    return;
  }

  document.getElementById('audit-content').innerHTML = Object.entries(byAgent).map(([agent, flags]) => {
    const flagRows = flags.map(row => {
      const code = String(row.debtor_code || '').toUpperCase();
      const debtor = debtorByAgentCode[`${agent}|${code}`] || debtorByCode[code]?.debtor || {};
      const owner = debtorByCode[code]?.owner || agent;
      const name = debtor.company_name || code;
      const type = debtor.debtor_type || '';
      const note = row.note || row.remark || '';
      const date = row.ts ? new Date(row.ts).toLocaleString('en-MY') : 'â€”';
      const ownerNote = owner && owner !== agent ? ` Â· owner: ${auditHtml(owner)}` : '';
      return `<div class="flag-row">
        <div class="claim-info">
          <div class="claim-name">${auditHtml(name)}</div>
          <div class="claim-code">${auditHtml(code)}${type ? ' Â· ' + auditHtml(type) : ''}${ownerNote}</div>
          <div class="flag-reason">âš‘ ${auditHtml(reasonLabels[row.reason] || row.reason || 'Flagged')}</div>
          ${note ? `<div class="flag-meta">"${auditHtml(note)}"</div>` : ''}
          <div class="flag-meta">Flagged: ${auditHtml(date)}</div>
        </div>
        <div class="claim-actions">
          <button class="audit-btn verify" onclick="resolveAuditFlag('${auditJs(month)}','${auditJs(agent)}','${auditJs(code)}')">âœ“ Resolve</button>
        </div>
      </div>`;
    }).join('');
    return `<div class="agent-section is-collapsed">
      <div class="agent-hdr" onclick="toggleAgentSection(this)">
        <div class="agent-name">${auditHtml(agent)}</div>
        <div class="agent-stats">
          <span class="stat-chip pending">${flags.length} open flag${flags.length === 1 ? '' : 's'}</span>
          <span class="agent-toggle">â–¸</span>
        </div>
      </div>
      <div class="claims-body">${flagRows}</div>
    </div>`;
  }).join('');
}

async function resolveAuditFlag(month, agent, debtorCode) {
  if (!confirm(`Resolve flag for ${debtorCode}?`)) return;
  const url = `${SUPABASE_URL}/rest/v1/flags?month=eq.${encodeURIComponent(month)}&agent=eq.${encodeURIComponent(agent)}&debtor_code=eq.${encodeURIComponent(debtorCode)}`;
  try {
    const r = await fetch(url, {
      method: 'DELETE',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
      }
    });
    if (!r.ok) throw new Error(`DELETE ${r.status}`);
    FLAGS_CACHE = (FLAGS_CACHE || []).filter(f =>
      !(f.month === month && f.agent === agent && String(f.debtor_code || '').toUpperCase() === debtorCode)
    );
    showToast('âœ“ Flag resolved');
    renderAudit();
  } catch(e) {
    console.warn('[audit-flags] resolve failed', e);
    showToast('âœ— Resolve failed');
  }
}

function renderAudit() {
  const month     = document.getElementById('month-select').value;
  const agentSel  = document.getElementById('agent-select').value;
  const allCamps  = (CAMP_DATA?.campaigns||[]);
  const isConversionCamp = camp => camp?.type === 'conversion_tiered' || camp?.type === 'conversion_simple';

  const bulkPanel = document.getElementById('bulk-approve-panel');
  if (activeCampId === 'FLAGS_LIST') {
    if (bulkPanel) bulkPanel.style.display = 'none';
    renderFlagAudit();
    return;
  }
  if (bulkPanel) bulkPanel.style.display = '';

  if (activeCampId === 'BDAY_LIST') {
    renderBirthdayDebtorList(month, agentSel);
    return;
  }

  // Build a lookup of debtor_code â†’ debtor object (per agent)
  // so we can show company names
  const debtorByAgentCode = {};
  AGENTS.forEach(a => {
    const list = DASH_DATA?.agents?.[a]?.debtor_cards?.debtors || [];
    list.forEach(d => {
      debtorByAgentCode[`${a}|${(d.debtor_code||'').toUpperCase()}`] = d;
    });
  });
  const liveCampaignDebtorByKey = {};
  allCamps.forEach(camp => {
    (camp.debtors || []).forEach(record => {
      const card = auditDebtorRecordToCard(record);
      if (!card) return;
      const agent = String(record.agent || card.agent || '').toUpperCase();
      const code = card.debtor_code;
      if (!agent || !code) return;
      liveCampaignDebtorByKey[`${agent}|${camp.id}|${code}`] = record;
      if (!debtorByAgentCode[`${agent}|${code}`]) debtorByAgentCode[`${agent}|${code}`] = card;
    });
  });

  // Build records from CLAIMS_CACHE (Supabase)
  const records = [];
  const seen = new Set();
  Object.entries(CLAIMS_CACHE).forEach(([key, claim]) => {
    const { agent, campId, debtorCode, stage } = parseAuditClaimKey(key);
    if (agentSel !== 'ALL' && agent !== agentSel) return;
    if (activeCampId !== 'ALL' && campId !== activeCampId) return;
    seen.add(`${agent}|${campId}|${debtorCode}|${stage}`);

    const camp = allCamps.find(c => c.id === campId)
      || (campId === 'birthday_gift_auto'
        ? { id:campId, name:'Birthday Gift', type:'birthday_gift' }
        : { id:campId, name:campId, type:'other' });
    const liveRecord = liveCampaignDebtorByKey[`${agent}|${campId}|${debtorCode}`];
    const debtor = debtorByAgentCode[`${agent}|${debtorCode}`] || auditDebtorRecordToCard(liveRecord) || {
      debtor_code: debtorCode,
      company_name: debtorCode,
      campaigns: []
    };
    // campEntry is the one entry in debtor.campaigns that matches this campId (for CAT info)
    const campEntry = (debtor.campaigns||[]).find(c => c.id === campId) || auditCampaignEntryFromDebtor(camp, liveRecord) || {};

    const audit = getAudit(month, agent, campId, debtorCode, stage);
    records.push({ camp, agent, debtor, campEntry, claim, audit, stage });
  });

  // Show full entitlement/enrollment lists, even before agents mark claimed.
  // In ALL mode this includes every active campaign for the month.
  const entitlementCamps = activeCampId === 'ALL'
    ? allCamps.filter(c => c.active && c.id !== 'birthday_gift_auto' && isCampaignActiveInMonth(c, month))
    : [allCamps.find(c => c.id === activeCampId) || { id:activeCampId, name:activeCampId, type:'other' }];

  entitlementCamps.forEach(selectedCamp => {
    const addEntitlement = (agentRaw, debtorCodeRaw, debtorRaw, campEntryRaw) => {
      const agent = String(agentRaw || '').toUpperCase();
      const debtorCode = String(debtorCodeRaw || '').toUpperCase();
      if (!agent || !debtorCode) return;
      if (agentSel !== 'ALL' && agent !== agentSel) return;
      const recordKey = `${agent}|${selectedCamp.id}|${debtorCode}|1`;
      if (seen.has(recordKey)) return;
      const debtor = debtorRaw || { debtor_code: debtorCode, company_name: debtorCode, campaigns: [] };
      records.push({
        camp: selectedCamp,
        agent,
        debtor,
        campEntry: campEntryRaw || {},
        claim: null,
        audit: null,
        stage: 1
      });
      seen.add(recordKey);
    };

    (selectedCamp.debtors || []).forEach(record => {
      const card = auditDebtorRecordToCard(record);
      if (!card) return;
      const agent = String(record.agent || card.agent || '').toUpperCase();
      const code = card.debtor_code;
      const generatedCard = debtorByAgentCode[`${agent}|${code}`];
      addEntitlement(agent, code, generatedCard || card, auditCampaignEntryFromDebtor(selectedCamp, record));
    });

    Object.entries(debtorByAgentCode).forEach(([lookupKey, debtor]) => {
      const [agent, debtorCode] = lookupKey.split('|');
      const campEntry = (debtor.campaigns || []).find(c => c.id === selectedCamp.id);
      if (!campEntry) return;
      addEntitlement(agent, debtorCode, debtor, campEntry);
    });
  });

  // Sort by agent first so the audit list is easy to work through by salesman.
  records.sort((a, b) => {
    const rank = r => (!r.audit ? 0 : r.audit.status === 'verified' ? 1 : 2);
    const ra = rank(a), rb = rank(b);
    const ca = isConversionCamp(a.camp) && a.campEntry?.converted ? 0 : 1;
    const cb = isConversionCamp(b.camp) && b.campEntry?.converted ? 0 : 1;
    return (a.agent || 'ZZZ').localeCompare(b.agent || 'ZZZ') ||
      (ca - cb) ||
      (normalizeAuditClaimStage(a.stage) - normalizeAuditClaimStage(b.stage)) ||
      (ra - rb) ||
      String(a.debtor?.company_name || '').localeCompare(String(b.debtor?.company_name || '')) ||
      String(a.debtor?.debtor_code || '').localeCompare(String(b.debtor?.debtor_code || ''));
  });

  // Summary
  const total    = records.length;
  const claimed  = records.filter(r=>!!r.claim).length;
  const verified = records.filter(r=>r.audit?.status==='verified').length;
  const rejected = records.filter(r=>r.audit?.status==='rejected').length;
  const excluded = records.filter(r=>r.claim?.status==='excluded').length;
  const pending  = claimed - verified - rejected - excluded;
  const unclaimed = total - claimed;
  const converted = records.filter(r=>isConversionCamp(r.camp) && r.campEntry?.converted).length;
  const showConvertedSummary = activeCampId !== 'ALL' && records.some(r=>isConversionCamp(r.camp));
  const pct      = total > 0 ? Math.round(claimed/total*100) : 0;
  const rowsForExport = records.map(r => {
    const isExcluded = r.claim?.status === 'excluded';
    const exportStatus = isConversionCamp(r.camp)
      ? (r.campEntry?.converted ? 'converted' : 'not_converted')
      : (!r.claim ? 'not_requested' : (isExcluded ? 'excluded' : (r.audit?.status || 'pending')));
    return {
      camp_id: r.camp.id || '',
      camp_name: r.camp.name || r.camp.id || '',
      stage: auditClaimStageLabel(r.stage),
      debtor_code: r.debtor.debtor_code || '',
      debtor_name: r.debtor.company_name || r.debtor.debtor_code || '',
      agent: r.agent || '',
      status: exportStatus,
      claimed_at: r.claim?.ts || '',
      verified_by: r.audit?.by || r.audit?.auditor || '',
      remark: isExcluded ? (r.claim?.reason || r.claim?.remark || '') : (r.claim?.remark || r.audit?.reason || ''),
    };
  });

  // Bridge: capture export state for regular audit views
  _lastAuditExport = {
    mode: 'audit',
    campId: activeCampId,
    month,
    agent: agentSel,
    rows: rowsForExport,
  };

  document.getElementById('summary-row').innerHTML = `
    <div class="sum-card"><div class="sum-val b">${total}</div><div class="sum-lbl">${activeCampId === 'ALL' ? 'Total Records' : 'Entitled'}</div></div>
    <div class="sum-card"><div class="sum-val g">${showConvertedSummary ? converted : claimed}</div><div class="sum-lbl">${showConvertedSummary ? 'Converted' : 'Submitted'}</div></div>
    <div class="sum-card"><div class="sum-val b">${verified}</div><div class="sum-lbl">Processed âœ“</div></div>
    <div class="sum-card"><div class="sum-val r">${rejected}</div><div class="sum-lbl">Rejected âœ—</div></div>
    <div class="sum-card"><div class="sum-val a">${showConvertedSummary ? total - converted : (activeCampId === 'ALL' ? pending : unclaimed)}</div><div class="sum-lbl">${showConvertedSummary ? 'Not Converted' : (activeCampId === 'ALL' ? 'Pending Requests' : 'Not Requested')}</div></div>`;

  if (!records.length) {
    document.getElementById('audit-content').innerHTML = `<div class="empty">No ${activeCampId==='ALL'?'claims':'campaign debtors'} for ${month}${activeCampId!=='ALL'?' in this campaign':''}</div>`;
    return;
  }

  // Group by agent
  const byAgent = {};
  records.forEach(r => {
    if (!byAgent[r.agent]) byAgent[r.agent] = [];
    byAgent[r.agent].push(r);
  });

  document.getElementById('audit-content').innerHTML = Object.entries(byAgent).map(([agent, recs]) => {
    const categoryFor = r => auditClaimCategory(r.claim, r.audit);
    const agentClaimed  = recs.filter(r=>['pending','verified','rejected'].includes(categoryFor(r))).length;
    const agentVerified = recs.filter(r=>categoryFor(r)==='verified').length;
    const agentRejected = recs.filter(r=>categoryFor(r)==='rejected').length;
    const agentExcluded = recs.filter(r=>categoryFor(r)==='excluded').length;
    const agentPending  = recs.filter(r=>categoryFor(r)==='pending').length;
    const agentUnclaimed = recs.filter(r=>categoryFor(r)==='unclaimed').length;
    const agentConverted = recs.filter(r=>isConversionCamp(r.camp) && r.campEntry?.converted).length;
    const agentShowsConversion = recs.some(r=>isConversionCamp(r.camp));
    const conversionPct = recs.length > 0 ? Math.round(agentConverted/recs.length*100) : 0;
    // Progress is computed only over non-excluded claims (excluded are out-of-scope for admin)
    const progressDenom = agentClaimed;
    const agentPct      = progressDenom > 0 ? Math.round((agentVerified+agentRejected)/progressDenom*100) : 0;
    const progColor     = agentPct>=80?'var(--green)':agentPct>=50?'var(--gold)':'var(--red)';

    const rows = recs.map(r => {
      const claimCategory = categoryFor(r);
      const isExcluded = claimCategory === 'excluded';
      const isManagerOff = auditClaimIsManagerOff(r.claim);
      const isConversion = isConversionCamp(r.camp);
      const isConverted = isConversion && !!r.campEntry?.converted;
      const requestLabel = claimCategory === 'unclaimed'
                         ? 'Not requested'
                         : isExcluded
                           ? 'ðŸš« Excluded'
                            : claimCategory === 'verified'
                             ? 'Processed'
                              : claimCategory === 'rejected'
                               ? 'Rejected'
                                : 'Request sent';
      const displayRequestLabel = isExcluded ? (isManagerOff ? 'Manager Off' : 'Excluded') : requestLabel;
      const conversionLabel = isConverted ? 'âœ“ Paid converted' : 'No paid order yet';
      const statusLabel = isConversion ? `${conversionLabel} Â· ${requestLabel}` : requestLabel;
      const auditStatusLabel = isConversion ? `${conversionLabel} - ${displayRequestLabel}` : displayRequestLabel;
      const statusClass = isConversion ? (isConverted ? 'claimed' : 'unclaimed') : (claimCategory === 'pending' ? 'pending' : claimCategory);
      const isFOC = r.camp.type==='foc_sample'||r.camp.type==='festive_gift'||r.camp.type==='birthday_gift';
      const actionLabel = claimCategory === 'unclaimed' ? 'Not requested' : (isExcluded ? (isManagerOff ? 'Manager removed' : 'Unable to deliver') : displayRequestLabel);
      const conversionMeta = isConversion ? `Feb-Apr: ${r.campEntry?.lookback_ctn ?? 0} CTN Â· May: ${r.campEntry?.current_ctn ?? 0} CTN` : '';
      const stage = normalizeAuditClaimStage(r.stage);

      // Reason label lookup (same as sales_dashboard)

      const reasonText = isExcluded ? (isManagerOff ? campaignAuditBulkReasonLabel(r.claim?.reason) : (reasonMap[r.claim?.reason] || r.claim?.reason || 'No reason')) : '';
      const claimTimeText = claimCategory === 'unclaimed' ? '' : (r.claim?.ts || 'Ã¢â‚¬â€');
      const rowActionHtml = claimCategory === 'pending'
        ? `<button class="audit-btn verify" onclick="auditClaim('${month}','${agent}','${r.camp.id}','${r.debtor.debtor_code}','verified',${stage})">âœ“</button>
           <button class="audit-btn reject" onclick="promptReject('${month}','${agent}','${r.camp.id}','${r.debtor.debtor_code}',${stage})">Ã—</button>`
        : (claimCategory === 'verified' || claimCategory === 'rejected')
          ? `<button class="audit-btn undo" onclick="auditClaim('${month}','${agent}','${r.camp.id}','${r.debtor.debtor_code}','undo',${stage})">Undo</button>`

            ? `<button class="audit-btn undo" onclick="undoManagerOff('${month}','${agent}','${r.camp.id}','${r.debtor.debtor_code}',${stage})">Undo Off</button>`
            : '';
      const managerOffActionHtml = isManagerOff
        ? `<button class="audit-btn undo" onclick="undoManagerOff('${month}','${agent}','${r.camp.id}','${r.debtor.debtor_code}',${stage})">Undo Off</button>`
        : '';

      return `<div class="claim-row ${statusClass}" id="row-${agent}-${r.camp.id}-${r.debtor.debtor_code}">
        <div class="claim-info">
          <div class="claim-name">${r.debtor.company_name||r.debtor.debtor_code}</div>
          <div class="claim-code">${r.debtor.debtor_code} Â· ${stageLabel} Â· ${CAMP_EMOJI[r.camp.type]||'ðŸ“‹'} ${r.camp.name}${r.campEntry.cat?' Â· CAT '+r.campEntry.cat:''}${r.claim?.bulk?' Â· ðŸ“¥ Bulk':''}</div>
          <div class="claim-meta">
            ${isConversion ? `${conversionMeta} Â· Claim: ${requestLabel}` : `${actionLabel}: ${r.claim?.ts||'â€”'}`}${isExcluded ? ` Â· <span style="color:#ff8866;">${reasonText}</span>` : ''}${r.claim?.remark?' Â· "'+r.claim.remark+'"':''}
            ${r.audit?.status==='verified'?` Â· âœ“ Processed ${r.audit.ts||''}`:r.audit?.status==='rejected'?` Â· âœ— Rejected: ${r.audit.reason||''}${r.audit.ts?' Â· '+r.audit.ts:''}` : ''}
          </div>
        </div>
        <div class="claim-actions">
          <span class="claim-status ${statusClass}">${auditStatusLabel}</span>
          ${managerOffActionHtml}
          ${!r.claim || isExcluded ? '' : (!r.audit ? `
            <button class="audit-btn verify" onclick="auditClaim('${month}','${agent}','${r.camp.id}','${r.debtor.debtor_code}','verified',${stage})">âœ“</button>
            <button class="audit-btn reject" onclick="promptReject('${month}','${agent}','${r.camp.id}','${r.debtor.debtor_code}',${stage})">âœ—</button>
          ` : `
            <button class="audit-btn undo" onclick="auditClaim('${month}','${agent}','${r.camp.id}','${r.debtor.debtor_code}','undo',${stage})">Undo</button>
          `)}
        </div>
      </div>`;
    }).join('');

    return `<div class="agent-section is-collapsed">
      <div class="agent-hdr" onclick="toggleAgentSection(this)">
        <div class="agent-name">${agent}</div>
        <div class="agent-stats">
          <span class="stat-chip pct">${agentShowsConversion ? `${conversionPct}% converted` : `${agentPct}% audited`}</span>
          <span class="stat-chip done">${agentShowsConversion ? `${agentConverted}/${recs.length} converted` : `${agentClaimed}/${recs.length} requests`}</span>
          ${!agentShowsConversion && agentPending>0?`<span class="stat-chip pending">${agentPending} pending</span>`:''}
          ${agentShowsConversion && recs.length-agentConverted>0?`<span class="stat-chip pending">${recs.length-agentConverted} not converted</span>`:''}
          ${!agentShowsConversion && agentUnclaimed>0?`<span class="stat-chip pending">${agentUnclaimed} not requested</span>`:''}
          ${agentVerified>0?`<span style="font-family:var(--mono);font-size:9px;color:var(--blue);">âœ“${agentVerified}</span>`:''}
          ${agentRejected>0?`<span style="font-family:var(--mono);font-size:9px;color:var(--red);">âœ—${agentRejected}</span>`:''}
          ${agentExcluded>0?`<span style="font-family:var(--mono);font-size:9px;color:#ff8866;">ðŸš«${agentExcluded}</span>`:''}
          <button onclick="event.stopPropagation();bulkApproveAgent('${agent}')"

      <div class="claims-body" id="claims-${agent}">${rows}</div>
    </div>`;
  }).join('');
}

// â”€â”€ Birthday debtor list management â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function auditMonthToIso(month) {
  const [mon, yy] = String(month || '').split(' ');
  const idx = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'].indexOf(mon);
  if (idx < 0) return '';
  return `${2000 + parseInt(yy || '0', 10)}-${String(idx + 1).padStart(2, '0')}`;
}

function auditBirthdayMonthLabel(month) {
  const [mon, yy] = String(month || '').split(' ');
  return `${mon || ''} ${2000 + parseInt(yy || '0', 10)}`.trim();
}

function auditBirthdayCampaignMonthKey() {
  const raw = String(DASH_DATA?.birthday_campaign?.month || '').trim();
  const m = raw.match(/^([A-Za-z]{3,9})\s+(\d{4})$/);
  if (!m) return DASH_DATA?.current_month || '';
  return `${m[1].slice(0, 3)} ${m[2].slice(-2)}`;
}

function auditHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

function auditJs(s) {
  return String(s ?? '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
}

function buildAuditDebtorLookup() {
  const byCode = {};
  AGENTS.forEach(agent => {
    const list = DASH_DATA?.agents?.[agent]?.debtor_cards?.debtors || [];
    list.forEach(d => {
      const code = (d.debtor_code || '').toUpperCase();
      if (!code) return;
      byCode[code] = {
        code,
        name: d.company_name || d.name || code,
        agent,
        type: d.debtor_type || '',
        phone: d.phone || d.mobile || d.contact || ''
      };
    });
  });
  return byCode;
}

async function fetchBirthdayOverridesForMonth(month) {
  const iso = auditMonthToIso(month);
  if (!iso) return {};
  const url = `${SUPABASE_URL}/rest/v1/targets_birthday_overrides?select=debtor_code,action&month=eq.${encodeURIComponent(iso)}`;
  try {
    const r = await fetch(url, {
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`
      }
    });
    if (!r.ok) throw new Error(`Supabase ${r.status}`);
    const rows = await r.json();
    const out = {};
    rows.forEach(row => {
      const code = (row.debtor_code || '').toUpperCase();
      if (code && (row.action === 'add' || row.action === 'remove')) out[code] = row.action;
    });
    return out;
  } catch (e) {
    console.warn('[birthday-audit] override fetch failed', e);
    showToast('Birthday override fetch failed');
    return {};
  }
}

async function saveBirthdayOverride(month, code, action) {
  const iso = auditMonthToIso(month);
  const cleanCode = String(code || '').trim().toUpperCase();
  if (!iso || !cleanCode || !['add','remove'].includes(action)) return false;
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/targets_birthday_overrides?on_conflict=month,debtor_code`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'resolution=merge-duplicates,return=minimal'
      },
      body: JSON.stringify({
        month: iso,
        debtor_code: cleanCode,
        action,
        birth_date: action
      })
    });
    if (!r.ok) throw new Error(await r.text());
    return true;
  } catch (e) {
    console.warn('[birthday-audit] override save failed', e);
    showToast('Birthday override save failed');
    return false;
  }
}

async function birthdayAuditRemove(month, code) {
  if (!confirm(`Remove ${code} from this month's birthday list?`)) return;
  if (await saveBirthdayOverride(month, code, 'remove')) {
    showToast('Birthday debtor removed');
    renderBirthdayDebtorList(month, document.getElementById('agent-select').value);
  }
}

async function birthdayAuditAdd(month, presetCode) {
  const raw = presetCode || prompt('Debtor code to add to this month birthday list:');
  const code = String(raw || '').trim().toUpperCase();
  if (!code) return;
  if (await saveBirthdayOverride(month, code, 'add')) {
    showToast('Birthday debtor added');
    renderBirthdayDebtorList(month, document.getElementById('agent-select').value);
  }
}

function parseBirthdayApprovedCodes(raw) {
  const matches = String(raw || '').toUpperCase().match(/[A-Z0-9]{2,4}-[A-Z0-9]+/g) || [];
  const seen = new Set();
  return matches.filter(code => {
    if (seen.has(code)) return false;
    seen.add(code);
    return true;
  });
}

function normalizeBirthdayBaseRow(row, lookup) {
  const code = (row.code || row.debtor_code || '').toUpperCase();
  const fallback = lookup[code] || {};
  return {
    code,
    name: row.name || row.company_name || fallback.name || code,
    agent: row.agent || fallback.agent || '',
    type: row.type || row.debtor_type || fallback.type || '',
    phone: row.phone || fallback.phone || '',
    source: row.source || 'auto',
    status: row.source === 'manual' ? 'added' : 'auto'
  };
}

function applyBirthdayOverridesToRows(baseRows, overrides, lookup) {
  const activeMap = new Map();
  const removedMap = new Map();

  (baseRows || []).forEach(row => {
    const d = normalizeBirthdayBaseRow(row, lookup);
    if (!d.code) return;
    if (overrides[d.code] === 'remove') {
      removedMap.set(d.code, { ...d, source: 'override', status: 'removed' });
    } else {
      activeMap.set(d.code, d);
    }
  });

  Object.entries(overrides || {}).forEach(([rawCode, action]) => {
    const code = String(rawCode || '').toUpperCase();
    if (!code) return;
    const fallback = lookup[code] || {};
    if (action === 'remove') {
      const existing = activeMap.get(code) || removedMap.get(code) || {
        code,
        name: fallback.name || code,
        agent: fallback.agent || '',
        type: fallback.type || '',
        phone: fallback.phone || '',
        source: 'override',
        status: 'removed'
      };
      activeMap.delete(code);
      removedMap.set(code, { ...existing, source: 'override', status: 'removed' });
    } else if (action === 'add') {
      const existing = activeMap.get(code) || removedMap.get(code) || {
        code,
        name: fallback.name || code,
        agent: fallback.agent || '',
        type: fallback.type || '',
        phone: fallback.phone || '',
        source: 'manual',
        status: 'added'
      };
      removedMap.delete(code);
      activeMap.set(code, { ...existing, source: 'manual', status: 'added' });
    }
  });

  return {
    finalRows: [...activeMap.values()],
    removedRows: [...removedMap.values()],
  };
}

function birthdayAuditCompareApproved(month) {
  const input = document.getElementById('bday-approved-codes');
  const resultEl = document.getElementById('bday-import-result');
  const state = _lastBirthdayAuditState;
  if (!input || !resultEl || !state || state.month !== month) return;

  const approvedCodes = parseBirthdayApprovedCodes(input.value);
  if (!approvedCodes.length) {
    resultEl.textContent = 'No debtor codes found in pasted text.';
    _lastBirthdayImportPlan = null;
    return;
  }

  const approvedSet = new Set(approvedCodes);
  const currentCodes = new Set(state.finalRows.map(d => d.code));
  const toRemove = state.finalRows.map(d => d.code).filter(code => !approvedSet.has(code));
  const toAdd = approvedCodes.filter(code => !currentCodes.has(code));
  const keepCount = approvedCodes.filter(code => currentCodes.has(code)).length;
  const unknownAdd = toAdd.filter(code => !state.lookup[code]);

  _lastBirthdayImportPlan = { month, toRemove, toAdd };
  resultEl.innerHTML = `
    Approved ${approvedCodes.length}; current ${currentCodes.size}; keep ${keepCount};
    remove ${toRemove.length}; add ${toAdd.length}${unknownAdd.length ? `; unknown ${unknownAdd.slice(0, 8).join(', ')}${unknownAdd.length > 8 ? '...' : ''}` : ''}.
    <button class="audit-btn verify" onclick="birthdayAuditApplyApproved('${auditJs(month)}')">Apply as official list</button>`;
}

async function birthdayAuditApplyApproved(month) {
  const plan = _lastBirthdayImportPlan;
  const resultEl = document.getElementById('bday-import-result');
  if (!plan || plan.month !== month) {
    if (resultEl) resultEl.textContent = 'Compare the approved list first.';
    return;
  }
  const totalActions = plan.toRemove.length + plan.toAdd.length;
  if (!totalActions) {
    if (resultEl) resultEl.textContent = 'No changes needed. Current list already matches.';
    return;
  }
  if (!confirm(`Apply approved list for ${month}? This will remove ${plan.toRemove.length} and add ${plan.toAdd.length}.`)) return;

  if (resultEl) resultEl.textContent = `Saving ${totalActions} birthday overrides...`;
  let saved = 0;
  for (const code of plan.toRemove) {
    if (await saveBirthdayOverride(month, code, 'remove')) saved++;
  }
  for (const code of plan.toAdd) {
    if (await saveBirthdayOverride(month, code, 'add')) saved++;
  }
  _lastBirthdayImportPlan = null;
  showToast(`Saved ${saved}/${totalActions} birthday overrides`);
  await renderBirthdayDebtorList(month, document.getElementById('agent-select').value);
}

async function renderBirthdayDebtorList(month, agentSel) {
  const contentEl = document.getElementById('audit-content');
  const summaryEl = document.getElementById('summary-row');
  contentEl.innerHTML = '<div class="empty">â³ Loading birthday list...</div>';

  const overrides = await fetchBirthdayOverridesForMonth(month);
  const lookup = buildAuditDebtorLookup();
  // Read per-month birthday list for the selected month, with backward-compat fallback
  const monthList = DASH_DATA?.birthday_by_month?.[month]?.debtors
                 ?? (month === auditBirthdayCampaignMonthKey() ? DASH_DATA?.birthday_campaign?.debtors : [])
                 ?? [];
  const adjustedBirthdayRows = applyBirthdayOverridesToRows(monthList, overrides, lookup);
  const finalRows = adjustedBirthdayRows.finalRows.filter(d => d.code);
  const removedRows = adjustedBirthdayRows.removedRows.filter(d => d.code);
  _lastBirthdayAuditState = { month, finalRows, removedRows, lookup };

  const allRows = [...finalRows, ...removedRows]
    .filter(d => agentSel === 'ALL' || d.agent === agentSel)
    .sort((a, b) =>
      (a.agent || 'ZZZ').localeCompare(b.agent || 'ZZZ') ||
      (a.name || '').localeCompare(b.name || '') ||
      a.code.localeCompare(b.code) ||
      a.status.localeCompare(b.status)
    );

  // Bridge: capture export state for birthday view
  _lastAuditExport = {
    mode: 'birthday',
    campId: 'BDAY_LIST',
    month,
    agent: agentSel,
    rows: allRows,
  };

  const autoCount = finalRows.filter(d => d.source !== 'manual').length;
  const addedCount = finalRows.filter(d => d.source === 'manual').length;
  const removedCount = Object.values(overrides).filter(a => a === 'remove').length;
  const finalCount = finalRows.length;
  const monthLabel = auditBirthdayMonthLabel(month);
  const birthdayCampId = 'birthday_gift_auto';

  function birthdayClaimFor(d) {
    const exact = getClaim(month, d.agent || '', birthdayCampId, d.code);
    if (exact) return { claim: exact, keyAgent: d.agent || '' };
    const suffix = `|${birthdayCampId}|${(d.code || '').toUpperCase()}|1`;
    const foundKey = Object.keys(CLAIMS_CACHE).find(k => k.endsWith(suffix));
    if (!foundKey) return { claim: null, keyAgent: d.agent || '' };
    return { claim: CLAIMS_CACHE[foundKey], keyAgent: foundKey.split('|')[0] || d.agent || '' };
  }

  function birthdayAuditFor(d, keyAgent) {
    return getAudit(month, keyAgent || d.agent || '', birthdayCampId, d.code);
  }

  const birthdayStatusRows = allRows.map(d => {
    const { claim, keyAgent } = birthdayClaimFor(d);
    const audit = claim ? birthdayAuditFor(d, keyAgent) : null;
    return { ...d, claim, audit, keyAgent };
  });
  const claimedCount = birthdayStatusRows.filter(d => !!d.claim && d.claim.status !== 'excluded').length;
  const verifiedCount = birthdayStatusRows.filter(d => d.audit?.status === 'verified').length;
  const rejectedCount = birthdayStatusRows.filter(d => d.audit?.status === 'rejected').length;
  const pendingCount = Math.max(0, claimedCount - verifiedCount - rejectedCount);

  summaryEl.innerHTML = `
    <div class="sum-card"><div class="sum-val b">${autoCount}</div><div class="sum-lbl">Auto</div></div>
    <div class="sum-card"><div class="sum-val g">${claimedCount}</div><div class="sum-lbl">Claimed</div></div>
    <div class="sum-card"><div class="sum-val b">${verifiedCount}</div><div class="sum-lbl">Verified</div></div>
    <div class="sum-card"><div class="sum-val a">${pendingCount}</div><div class="sum-lbl">Pending Audit</div></div>
    <div class="sum-card"><div class="sum-val r">${removedCount}</div><div class="sum-lbl">Removed</div></div>`;

  const renderBirthdayRow = d => {
    const isRemoved = d.status === 'removed';
    const isAdded = d.status === 'added';
    const { claim, keyAgent } = birthdayClaimFor(d);
    const audit = claim ? birthdayAuditFor(d, keyAgent) : null;
    const statusClass = isRemoved ? 'pending'
      : !claim ? 'unclaimed'
      : audit?.status === 'verified' ? 'verified'
      : audit?.status === 'rejected' ? 'rejected'
      : 'claimed';
    const claimLabel = isRemoved ? 'REMOVED'
      : !claim ? 'NOT CLAIMED'
      : audit?.status === 'verified' ? 'VERIFIED'
      : audit?.status === 'rejected' ? 'REJECTED'
      : 'CLAIMED';
    const sourceBadge = isRemoved
      ? '<span class="claim-status pending" style="color:#aaa;background:rgba(255,255,255,.08);">REMOVED</span>'
      : isAdded
        ? '<span class="claim-status claimed" style="color:var(--accent);background:rgba(255,165,0,.12);">ADDED</span>'
        : '<span class="claim-status pending">AUTO</span>';
    const claimBadge = `<span class="claim-status ${statusClass}">${claimLabel}</span>`;
    const rowStyle = isRemoved ? 'opacity:.65;' : '';
    const nameStyle = isRemoved ? 'text-decoration:line-through;color:var(--muted);' : '';
    const claimMeta = !claim ? 'Gift not marked claimed yet'
      : `Gift marked: ${claim.ts || '-'}${claim.remark ? ' - "' + auditHtml(claim.remark) + '"' : ''}${audit?.status === 'verified' ? ' - Verified' : audit?.status === 'rejected' ? ' - Rejected' : ''}`;
    return `<div class="claim-row ${statusClass}" style="${rowStyle}">
      <div class="claim-info">
        <div class="claim-name" style="${nameStyle}">${auditHtml(d.name)}</div>
        <div class="claim-code">${auditHtml(d.code)} - ${auditHtml(d.agent || 'Unknown agent')}${d.type ? ' - ' + auditHtml(d.type) : ''}${d.phone ? ' - ' + auditHtml(d.phone) : ''}</div>
        <div class="claim-meta">${isRemoved ? 'Excluded by month-scoped birthday override' : isAdded ? 'Manually added in birthday overrides' : 'Auto-selected from birthday rules'} - ${claimMeta}</div>
      </div>
      <div class="claim-actions">
        ${sourceBadge}
        ${claimBadge}
        ${isRemoved
          ? `<button class="audit-btn verify" onclick="birthdayAuditAdd('${auditJs(month)}','${auditJs(d.code)}')">+ Add</button>`
          : `${claim ? (!audit ? `
            <button class="audit-btn verify" onclick="auditClaim('${auditJs(month)}','${auditJs(keyAgent || d.agent)}','${birthdayCampId}','${auditJs(d.code)}','verified')">OK</button>
            <button class="audit-btn reject" onclick="promptReject('${auditJs(month)}','${auditJs(keyAgent || d.agent)}','${birthdayCampId}','${auditJs(d.code)}')">Reject</button>
          ` : `
            <button class="audit-btn undo" onclick="auditClaim('${auditJs(month)}','${auditJs(keyAgent || d.agent)}','${birthdayCampId}','${auditJs(d.code)}','undo')">Undo</button>
          `) : ''}
          <button class="audit-btn reject" onclick="birthdayAuditRemove('${auditJs(month)}','${auditJs(d.code)}')">Remove</button>`}
      </div>
    </div>`;
  };

  const rowsByAgent = {};
  allRows.forEach(d => {
    const key = d.agent || 'Unknown agent';
    if (!rowsByAgent[key]) rowsByAgent[key] = [];
    rowsByAgent[key].push(d);
  });
  const rowsHtml = Object.entries(rowsByAgent)
    .sort(([a], [b]) => a.localeCompare(b))
    .map(([agent, rows]) => {
      const agentClaimed = rows.filter(d => !!birthdayClaimFor(d).claim).length;
      return `<div class="agent-section is-collapsed">
      <div class="agent-hdr" onclick="toggleAgentSection(this)">
        <div>
          <div class="agent-name"><span class="agent-toggle">&gt;</span> ${auditHtml(agent)}</div>
          <div style="font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:2px;">
            ${rows.length} birthday debtors - ${agentClaimed}/${rows.length} claimed
          </div>
        </div>
        <div class="agent-stats">
          <span class="stat-chip done">${agentClaimed}/${rows.length} claimed</span>
          <span class="stat-chip done">${rows.length}</span>
        </div>
      </div>
      <div class="claims-body">${rows.map(renderBirthdayRow).join('')}</div>
    </div>`;
    }).join('');

  contentEl.innerHTML = `
    <div class="agent-section">
      <div class="agent-hdr" style="cursor:default;">
        <div>
          <div class="agent-name">Birthday ${auditHtml(monthLabel)}</div>
          <div style="font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:2px;">
            Auto: ${autoCount} + Added: ${addedCount} = ${finalCount} active. Claimed: ${claimedCount}. Verified: ${verifiedCount}. Removed: ${removedCount} separately.
          </div>
        </div>
        <div class="agent-stats">
          <button class="audit-btn verify" onclick="birthdayAuditAdd('${auditJs(month)}')">+ Add debtor</button>
        </div>
      </div>
      <div class="birthday-import">
        <div class="birthday-import-title">Approved list compare</div>
        <textarea id="bday-approved-codes" placeholder="Paste your approved debtor codes here, one per line or copied from Excel."></textarea>
        <div class="birthday-import-actions">
          <button class="audit-btn undo" onclick="birthdayAuditCompareApproved('${auditJs(month)}')">Compare approved list</button>
          <span id="bday-import-result" class="birthday-import-result">This only saves month-scoped add/remove overrides after you click apply.</span>
        </div>
      </div>
      <div class="claims-body">${rowsHtml || `<div class="empty">No birthday debtors${agentSel !== 'ALL' ? ' for ' + auditHtml(agentSel) : ''}</div>`}</div>
    </div>`;
}

function toggleAgentSection(hdr) {
  const section = hdr.closest('.agent-section');
  if (!section) return;
  const collapsed = section.classList.toggle('is-collapsed');
  const icon = section.querySelector('.agent-toggle');
  if (icon) icon.textContent = collapsed ? 'â–¸' : 'â–¾';
}

function setAllAgentSections(expand) {
  document.querySelectorAll('.agent-section').forEach(section => {
    section.classList.toggle('is-collapsed', !expand);
    const icon = section.querySelector('.agent-toggle');
    if (icon) icon.textContent = expand ? 'â–¾' : 'â–¸';
  });
}

async function auditClaim(month, agent, campId, debtorCode, action, stage = 1) {
  const cleanStage = normalizeAuditClaimStage(stage);
  const now = new Date();
  const ts  = now.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})+' '+now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  if (action === 'undo') {
    await saveAudit(month, agent, campId, debtorCode, {status:'undo', ts, by:'management', stage: cleanStage}, cleanStage);
  } else {
    await saveAudit(month, agent, campId, debtorCode, {status:action, ts, by:'management', stage: cleanStage}, cleanStage);
  }
  showToast(action==='verified'?'âœ“ Verified':action==='undo'?'Undo done':'âœ— Rejected');
  renderAudit();
}

async function undoManagerOff(month, agent, campId, debtorCode, stage = 1) {
  if (!confirm(`Undo manager off for ${debtorCode}?`)) return;
  const cleanStage = normalizeAuditClaimStage(stage);
  const code = String(debtorCode || '').toUpperCase();
  const key = getClaimKey(month, agent, campId, code, cleanStage);
  const slug = String(month || '').replace(' ', '');
  const storageSuffix = cleanStage === 2 ? '__stage2' : '';

  localStorage.removeItem(`camp_claim_${slug}_${agent}_${campId}_${code}${storageSuffix}`);
  delete CLAIMS_CACHE[key];
  delete AUDIT_CACHE[key];

  if (typeof GistSync !== 'undefined' && GistSync.removeClaim) {
    await GistSync.removeClaim(month, agent, campId, code, cleanStage);
  }
  if (typeof GistSync !== 'undefined' && GistSync.logAudit) {
    GistSync.logAudit('management', 'campaign_audit_bulk_remove_undo', month, {
      agent,
      camp_id: campId,
      debtor_code: code,
      stage: cleanStage
    });
  }
  showToast('Manager off undone');
  renderAudit();
}

  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:9999;display:flex;align-items:flex-end;justify-content:center;';

      <div style="font-family:var(--display);font-size:20px;color:var(--red);margin-bottom:12px;">âœ— Reject Claim</div>
      <div style="font-family:var(--mono);font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;">Reason (required)</div>
      <input type="text" id="reject-reason" placeholder="e.g. No photo proof, wrong quantity, duplicate"

      <div style="display:flex;gap:10px;">

          style="flex:1;background:rgba(255,95,95,.2);border:1px solid rgba(255,95,95,.4);color:var(--red);font-family:var(--mono);font-size:12px;font-weight:700;padding:12px;border-radius:10px;cursor:pointer;">
          âœ— CONFIRM REJECT
        </button>
        <button onclick="this.closest('div[style*=fixed]').remove()"
          style="flex:1;background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--muted);font-family:var(--mono);font-size:11px;padding:12px;border-radius:10px;cursor:pointer;">

        </button>

  setTimeout(()=>document.getElementById('reject-reason')?.focus(),100);
}

async function confirmReject(month, agent, campId, debtorCode, btn, stage = 1) {
  const cleanStage = normalizeAuditClaimStage(stage);
  const reason = document.getElementById('reject-reason')?.value?.trim();
  if (!reason) { document.getElementById('reject-reason').style.borderColor='var(--red)'; return; }
  const now = new Date();
  const ts  = now.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})+' '+now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  await saveAudit(month, agent, campId, debtorCode, {status:'rejected', reason, ts, by:'management', stage: cleanStage}, cleanStage);

// â”€â”€ Bulk approve â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
// Batch UPDATE in Supabase: mark many pending claims as verified at once.
async function _bulkVerifyInSupabase(month, claimFilters) {
  // claimFilters: array of { agent, camp_id, debtor_code, stage }
  if (!claimFilters.length) return { ok:0, fail:0 };

  const now = new Date();
  const ts  = now.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})+' '+now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  // Try with audit metadata first; fall back to status-only if unsupported
  const bodyFull = { status:'verified', audit_ts: ts, audit_by: 'management' };
  const bodyMin  = { status:'verified' };

  let ok = 0, fail = 0;
  const BATCH = 50;  // PATCH via or() filter â€” keep URL manageable
  for (let i = 0; i < claimFilters.length; i += BATCH) {
    const slice = claimFilters.slice(i, i + BATCH);
    const conditions = slice.map(cf =>
      `and(agent.eq.${encodeURIComponent(cf.agent)},camp_id.eq.${encodeURIComponent(cf.camp_id)},debtor_code.eq.${encodeURIComponent(cf.debtor_code)},stage.eq.${normalizeAuditClaimStage(cf.stage)})`
    ).join(',');
    const url = `${SUPABASE_URL}/rest/v1/claims?month=eq.${encodeURIComponent(month)}&or=(${conditions})`;

    try {
      let r = await fetch(url, {
        method: 'PATCH',
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify(bodyFull)
      });
      // Fallback if audit columns don't exist yet
      if (!r.ok) {
        r = await fetch(url, {
          method: 'PATCH',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json',
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify(bodyMin)
        });
      }
      if (r.ok) {
        ok += slice.length;
        // Update in-memory cache
        slice.forEach(cf => {
          const key = getAuditKey(month, cf.agent, cf.camp_id, cf.debtor_code, cf.stage);
          AUDIT_CACHE[key] = { status:'verified', ts, by:'management' };
        });
      } else {
        const err = await r.text();
        console.warn('[bulk-approve] batch failed', r.status, err);
        fail += slice.length;
      }
    } catch(e) {
      console.warn('[bulk-approve] network error', e);
      fail += slice.length;
    }
  }

  return { ok, fail };
}

// Approve all pending claims in the CURRENT VIEW (current campaign + agent filter)
async function bulkApproveAllPending() {
  const month     = document.getElementById('month-select').value;
  const agentSel  = document.getElementById('agent-select').value;
  const statusEl  = document.getElementById('bulk-approve-status');

  // Find all pending in the currently filtered view
  const pending = [];
  Object.keys(CLAIMS_CACHE).forEach(key => {
    const { agent, campId, debtorCode, stage } = parseAuditClaimKey(key);
    if (agentSel !== 'ALL' && agent !== agentSel) return;
    if (activeCampId !== 'ALL' && campId !== activeCampId) return;
    if (AUDIT_CACHE[key]) return;  // already audited
    if (CLAIMS_CACHE[key]?.status === 'excluded') return;  // agent-excluded, not admin's to approve
    pending.push({ agent, camp_id:campId, debtor_code:debtorCode, stage });
  });

  if (!pending.length) {
    statusEl.textContent = 'No pending claims in current view';

  if (!confirm(`Approve ALL ${pending.length} pending claims in current view?\n\nFilter: ${activeCampId==='ALL'?'All campaigns':activeCampId}, ${agentSel==='ALL'?'All agents':agentSel}\n\nThis will set status to "verified" in Supabase.`)) return;

  statusEl.textContent = `â³ Approving ${pending.length} claims...`;
  statusEl.style.color = 'var(--accent)';

  const { ok, fail } = await _bulkVerifyInSupabase(month, pending);
  statusEl.textContent = `âœ“ ${ok} approved${fail?` Â· âœ— ${fail} failed`:''}`;
  statusEl.style.color = fail ? 'var(--red)' : 'var(--green)';
  renderAudit();
}

// Approve all pending claims for a specific campaign (prompts for campaign)
async function bulkApproveByCampaign() {
  const month    = document.getElementById('month-select').value;
  const statusEl = document.getElementById('bulk-approve-status');
  const camps    = (CAMP_DATA?.campaigns || []).filter(c => isCampaignActiveInMonth(c, month));

  // Build picker
  const campOptions = camps.map(c => {
    const cnt = Object.keys(CLAIMS_CACHE).filter(k => {
      const { campId } = parseAuditClaimKey(k);
      return campId === c.id && !AUDIT_CACHE[k] && CLAIMS_CACHE[k]?.status !== 'excluded';
    }).length;
    return { id: c.id, name: c.name, pending: cnt };
  }).filter(o => o.pending > 0);

  if (!campOptions.length) {
    statusEl.textContent = 'No pending claims across any campaign';
    statusEl.style.color = 'var(--muted)';
    return;
  }

  const picked = prompt(
    'Approve all pending for which campaign?\n\n' +
    campOptions.map((o, i) => `${i+1}. ${o.name} (${o.pending} pending)`).join('\n') +
    '\n\nType the number:'
  );
  const idx = parseInt(picked, 10) - 1;
  if (isNaN(idx) || idx < 0 || idx >= campOptions.length) return;

  const chosen = campOptions[idx];
  if (!confirm(`Approve ALL ${chosen.pending} pending claims for "${chosen.name}"?`)) return;

  const pending = [];
  Object.keys(CLAIMS_CACHE).forEach(key => {
    const { agent, campId, debtorCode, stage } = parseAuditClaimKey(key);
    if (campId !== chosen.id) return;
    if (AUDIT_CACHE[key]) return;
    if (CLAIMS_CACHE[key]?.status === 'excluded') return;
    pending.push({ agent, camp_id:campId, debtor_code:debtorCode, stage });
  });

  statusEl.textContent = `â³ Approving ${pending.length} for ${chosen.name}...`;
  statusEl.style.color = 'var(--accent)';

  const { ok, fail } = await _bulkVerifyInSupabase(month, pending);
  statusEl.textContent = `âœ“ ${chosen.name}: ${ok} approved${fail?` Â· âœ— ${fail} failed`:''}`;
  statusEl.style.color = fail ? 'var(--red)' : 'var(--green)';
  renderAudit();
}

// Iterates CLAIMS_CACHE (Supabase) so bulk-imported claims are included
function exportAuditCSV() {
  const month    = document.getElementById('month-select').value;
  const agentSel = document.getElementById('agent-select').value;
  const allCamps = CAMP_DATA?.campaigns||[];
  const rows     = [['Month','Agent','Stage','Debtor Code','Debtor Name','Campaign','Type','CAT','Claim Status','Claim Time','Bulk','Remark','Audit Status','Audit Time','Reject Reason']];

  // Build debtor lookup for company names
  const debtorByAgentCode = {};
  AGENTS.forEach(a => {
    const list = DASH_DATA?.agents?.[a]?.debtor_cards?.debtors || [];
    list.forEach(d => { debtorByAgentCode[`${a}|${(d.debtor_code||'').toUpperCase()}`] = d; });
  });

  Object.entries(CLAIMS_CACHE).forEach(([key, claim]) => {
    const { agent, campId, debtorCode, stage } = parseAuditClaimKey(key);
    if (agentSel !== 'ALL' && agent !== agentSel) return;
    if (activeCampId !== 'ALL' && campId !== activeCampId) return;

    const camp = allCamps.find(c => c.id === campId) || { name: campId, type: 'other' };
    const debtor = debtorByAgentCode[`${agent}|${debtorCode}`] || { debtor_code: debtorCode, company_name: debtorCode, campaigns: [] };
    const campEntry = (debtor.campaigns||[]).find(c => c.id === campId) || {};
    const audit = getAudit(month, agent, campId, debtorCode, stage);

    rows.push([
      month, agent, auditClaimStageLabel(stage),
      debtorCode, (debtor.company_name||'').replace(/,/g,''),
      (camp.name||'').replace(/,/g,''),
      CAMP_LABEL[camp.type] || camp.type || '',
      campEntry.cat || '',
      'Claimed',
      claim.ts || '',
      claim.bulk ? 'Yes' : 'No',
      (claim.remark||'').replace(/,/g,''),
      audit?.status || 'pending',
      audit?.ts || '',
      (audit?.reason||'').replace(/,/g,''),
    ]);
  });

  const csv  = rows.map(r=>r.join(',')).join('\n');
  const blob = new Blob([csv],{type:'text/csv'});
  const a    = document.createElement('a');
  a.href     = URL.createObjectURL(blob);
  a.download = `campaign_audit_${month.replace(' ','')}_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

      'Name': r.debtor_name || r.name || '',

    ws['!cols'] = [{wch:30},{wch:14},{wch:30},{wch:10},{wch:12},{wch:18},{wch:14},{wch:30}];
    let sheetName = `Audit ${campId || 'ALL'}`.replace(/[:\\\/\?\*\[\]]/g, '_');
    if (sheetName.length > 31) sheetName = sheetName.slice(0,28) + '...';
    XLSX.utils.book_append_sheet(wb, ws, sheetName);
  }

  const today = new Date().toISOString().slice(0,10);
  const safeAgent = (agent || 'all').replace(/[^a-zA-Z0-9_-]/g, '_');
  const safeCamp = (campId || 'ALL').replace(/[^a-zA-Z0-9_-]/g, '_');
  const filename = `Audit_${safeCamp}_${safeAgent}_${today}.xlsx`;
  XLSX.writeFile(wb, filename);
}

function loadBulkDebtors() {
  const agent  = document.getElementById('bulk-agent-sel')?.value;
  const campId = document.getElementById('bulk-camp-sel')?.value;
  const month  = document.getElementById('month-select').value;
  const el     = document.getElementById('bulk-debtor-list');
  const mode   = document.getElementById('bulk-action-mode')?.value === 'remove' ? 'remove' : 'delivered';
  if (!el || !campId) return;
  if (mode !== 'remove' && !agent) return;

  const camp = (CAMP_DATA?.campaigns || []).find(c => c.id === campId);
  const agentList = (mode === 'remove' && (!agent || agent === 'ALL')) ? AGENTS : [agent];
  const byAgentCode = {};
  const agentMatches = rowAgent => {
    if (!rowAgent) return false;
    if (mode === 'remove' && (!agent || agent === 'ALL')) return true;
    return String(rowAgent || '').toUpperCase() === String(agent || '').toUpperCase();
  };

  agentList.forEach(rowAgent => {
    const debtors = DASH_DATA?.agents?.[rowAgent]?.debtor_cards?.debtors || [];
    debtors
      .filter(d => (d.campaigns||[]).some(c=>c.id===campId))
      .forEach(d => {
        const code = String(d.debtor_code || '').toUpperCase();
        if (!code) return;
        byAgentCode[`${rowAgent}|${code}`] = { agent: rowAgent, debtor: d };
      });
  });
  (camp?.debtors || []).forEach(record => {
    const rowAgent = String(record.agent || '').trim();
    if (!agentMatches(rowAgent)) return;
    const card = auditDebtorRecordToCard(record);
    if (!card) return;
    const code = String(card.debtor_code || '').toUpperCase();
    if (!code) return;
    byAgentCode[`${rowAgent}|${code}`] = byAgentCode[`${rowAgent}|${code}`] || { agent: rowAgent, debtor: card };
  });
  const campDebtors = Object.values(byAgentCode).sort((a, b) => (
    String(a.agent).localeCompare(String(b.agent)) ||
    String(a.debtor.company_name || a.debtor.debtor_code).localeCompare(String(b.debtor.company_name || b.debtor.debtor_code))
  ));

  if (!campDebtors.length) {
    el.innerHTML = `<div style="font-family:var(--mono);font-size:10px;color:var(--muted);padding:10px 0;">No debtors found for this ${mode === 'remove' ? 'scope' : 'agent'}/campaign</div>`;
    return;
  }

  el.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
      <div style="font-family:var(--mono);font-size:9px;color:var(--muted);text-transform:uppercase;">${campDebtors.length} debtors - ${mode === 'remove' ? 'unclaimed only' : 'unmarked only'}</div>
      <button onclick="toggleAllBulk(true)" style="font-family:var(--mono);font-size:9px;background:transparent;border:1px solid var(--border);color:var(--muted);padding:3px 8px;border-radius:6px;cursor:pointer;">Select All</button>
    </div>
    ${campDebtors.map(row => {
      const d = row.debtor;
      const rowAgent = row.agent;
      const code = String(d.debtor_code || '').toUpperCase();
      const claim = getClaim(month, rowAgent, campId, code);
      const state = campaignAuditBulkSelectionState(claim, getAudit(month, rowAgent, campId, code), mode);
      return `<label style="display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;background:rgba(255,255,255,.02);margin-bottom:4px;cursor:pointer;${state.canSelect?'':'opacity:.4;pointer-events:none;'}">
        <input type="checkbox" class="bulk-check" value="${code}" data-code="${code}" data-agent="${rowAgent}" ${state.canSelect?'':'disabled'} style="width:16px;height:16px;">
        <div>
          <div style="font-family:var(--mono);font-size:11px;font-weight:500;">${d.company_name||d.debtor_code}</div>
          <div style="font-family:var(--mono);font-size:8px;color:var(--muted);">${code} - ${rowAgent}${state.label?' - '+state.label:''}</div>
        </div>
      </label>`;
    }).join('')}`;
}

async function confirmBulkMark(month) {
  const agent  = document.getElementById('bulk-agent-sel')?.value;
  const campId = document.getElementById('bulk-camp-sel')?.value;
  const mode   = document.getElementById('bulk-action-mode')?.value === 'remove' ? 'remove' : 'delivered';
  if (!campId) { showToast('Select campaign first'); return; }
  if (mode !== 'remove' && !agent) { showToast('Select agent and campaign first'); return; }

  const checked = campaignAuditBulkSelectedEntries(document.querySelectorAll('.bulk-check:checked'), agent);
  if (!checked.length) { showToast('No debtors selected'); return; }

  const reason = document.getElementById('bulk-remove-reason')?.value || 'management_decision';
  const remark = document.getElementById('bulk-remove-remark')?.value?.trim() || '';
  if (mode === 'remove' && reason === 'other' && !remark) {
    showToast('Remark required for Other');
    return;
  }
  const affectedAgents = [...new Set(checked.map(entry => entry.agent))].sort();
  const scopeLabel = mode === 'remove' && (!agent || agent === 'ALL') ? `${affectedAgents.length} agents` : agent;
  if (mode === 'remove' && !confirm(`Remove ${checked.length} debtors from target for ${scopeLabel}?\n\nThis keeps the admin listing but deducts them from effective target.`)) return;

  const ts = new Date().toISOString();
  const camp = (CAMP_DATA?.campaigns || []).find(c => c.id === campId);
  const batchId = `${mode === 'remove' ? 'bulk_off' : 'bulk_mark'}_${Date.now().toString(36)}`;

  await Promise.all(checked.map(entry => {
    const claimData = campaignAuditBulkClaimData(mode, {
      ts,
      reason,
      remark,
      batchId,
      campType: camp?.type || null
    });
    claimData.stage = 1;
    const code = String(entry.debtorCode || '').toUpperCase();
    const rowAgent = entry.agent;
    const key = `camp_claim_${month.replace(' ','')}_${rowAgent}_${campId}_${code}`;
    localStorage.setItem(key, JSON.stringify(claimData));
    const cacheKey = getClaimKey(month, rowAgent, campId, code, 1);
    CLAIMS_CACHE[cacheKey] = claimData;
    if (mode === 'remove') {
      delete AUDIT_CACHE[cacheKey];
    } else {
      AUDIT_CACHE[cacheKey] = { status:'verified', ts, by:'management' };
    }
    if (typeof GistSync !== 'undefined' && GistSync.saveClaim) {
      return GistSync.saveClaim(month, rowAgent, campId, code, claimData, 1);
    }
    return Promise.resolve();
  }));

  if (typeof GistSync !== 'undefined' && GistSync.logAudit) {
    GistSync.logAudit('management', mode === 'remove' ? 'campaign_audit_bulk_remove' : 'campaign_audit_bulk_mark', month, {
      agent: scopeLabel,
      agents: affectedAgents,
      camp_id: campId,
      count: checked.length,
      mode,
      reason: mode === 'remove' ? reason : '',
      batch_id: batchId
    });
  }

  document.querySelector('div[style*=fixed]')?.remove();
  showToast(mode === 'remove'
    ? `Done: ${checked.length} debtors removed from target`
    : `Done: ${checked.length} debtors marked as delivered`);
  renderAudit();
}
