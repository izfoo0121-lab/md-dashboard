function doRestoreClaims(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const claims = JSON.parse(e.target.result);
      let count = 0;
      Object.entries(claims).forEach(([k, v]) => {
        if (k.startsWith('camp_claim_')) {
          localStorage.setItem(k, JSON.stringify(v));
          count++;
        }
      });
      showToast(`âœ“ ${count} claims restored`);
      renderAudit();
    } catch(err) {
      showToast('âŒ Invalid backup file');
    }
  };
  reader.readAsText(file);
  input.value = '';
}

function handleBulkFile(input) {
  const file = input.files[0];
  if (!file) return;
  const statusEl = document.getElementById('bulk-file-status');

  if (file.name.endsWith('.csv')) {
    const reader = new FileReader();
    reader.onload = e => {
      const lines = e.target.result.split('\n');
      const header = lines[0].toLowerCase().split(',');
      const codeCol = header.findIndex(h => h.includes('code') || h.includes('debtor'));
      if (codeCol < 0) { statusEl.textContent = 'âŒ No "Code" or "Debtor Code" column found'; statusEl.style.color='var(--red)'; statusEl.style.display='block'; return; }
      const codes = lines.slice(1).map(l => l.split(',')[codeCol]?.trim()).filter(Boolean);
      applyBulkCodes(codes, file.name, statusEl);
    };
    reader.readAsText(file);
  } else if (file.name.endsWith('.xlsx')) {
    // Use SheetJS if available
    if (typeof XLSX !== 'undefined') {
      const reader = new FileReader();
      reader.onload = e => {
        const wb = XLSX.read(e.target.result, {type:'binary'});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, {defval:''});
        const codeKey = Object.keys(rows[0]||{}).find(k => k.toLowerCase().includes('code') || k.toLowerCase().includes('debtor'));
        if (!codeKey) { statusEl.textContent = 'âŒ No "Code" or "Debtor Code" column found'; statusEl.style.color='var(--red)'; statusEl.style.display='block'; return; }
        const codes = rows.map(r => String(r[codeKey]||'').trim()).filter(Boolean);
        applyBulkCodes(codes, file.name, statusEl);
      };
      reader.readAsBinaryString(file);
    } else {
      statusEl.textContent = 'âš  SheetJS not loaded â€” use CSV format instead';
      statusEl.style.color = 'var(--gold)';
      statusEl.style.display = 'block';
    }
  }
}

function applyBulkCodes(codes, filename, statusEl) {
  // Match uploaded codes against debtor list and auto-check them
  const wantedCodes = new Set((codes || []).flatMap(campaignAuditBulkCodeKeys));
  const checkboxes = document.querySelectorAll('.bulk-check:not([disabled])');
  let matched = 0;
  checkboxes.forEach(cb => {
    const codeKeys = campaignAuditBulkCodeKeys(cb.dataset?.code || cb.value);
    if (codeKeys.some(code => wantedCodes.has(code))) {
      cb.checked = true;
      matched++;
    }
  });
  statusEl.textContent = `âœ“ ${filename}: ${codes.length} codes loaded, ${matched} matched and selected`;
  statusEl.style.color = matched > 0 ? 'var(--green)' : 'var(--gold)';
  statusEl.style.display = 'block';
}

const GistSync = (() => {

  function _headers(extra) {
    return Object.assign({
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json'
    }, extra || {});
  }

  function _slug(month) { return (month || '').replace(' ',''); }

  // Normalize a timestamp value to ISO 8601 format for Supabase timestamptz columns.
  // Accepts:
  //   - Already-ISO strings (returned as-is)
  //   - Date objects (toISOString)
  //   - Human strings like "24 Apr 14:32" from older saveCampClaim (today's date + parsed time)
  //   - null/undefined (returns current time as ISO)
  // Never throws; falls back to now().
  function _normalizeTs(ts) {
    if (!ts) return new Date().toISOString();
    if (ts instanceof Date) return ts.toISOString();
    if (typeof ts !== 'string') return new Date().toISOString();
    // Already ISO? (crude but effective â€” ISO starts with YYYY-MM-DD)
    if (/^\d{4}-\d{2}-\d{2}T/.test(ts)) return ts;
    // Human format "24 Apr 14:32" â€” check BEFORE native Date parse, because
    // native Date.parse() mis-interprets this as year 2001 in many engines.
    const m = /^(\d{1,2})\s+([A-Za-z]{3})\s+(\d{1,2}):(\d{2})$/.exec(ts.trim());
    if (m) {
      const MONS = { Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11 };
      const mo = MONS[m[2]];
      if (mo !== undefined) {
        const now = new Date();
        return new Date(now.getFullYear(), mo, parseInt(m[1]), parseInt(m[3]), parseInt(m[4])).toISOString();
      }
    }
    // Try native Date parse (handles date-only "2026-04-24", RFC strings, etc.)
    const parsed = new Date(ts);
    if (!isNaN(parsed.getTime())) {
      // Sanity check: reject obviously wrong years (pre-2020 indicates parse ambiguity)
      if (parsed.getFullYear() >= 2020 && parsed.getFullYear() <= 2100) {
        return parsed.toISOString();
      }
    }
    // Give up; use now() so at least the row inserts
    return new Date().toISOString();
  }

  // Convert slug like "Apr26" back to "Apr 26" for Supabase queries
  function _monthFromSlug(slug) {
    const m = /^([A-Za-z]{3})(\d+)$/.exec(slug || '');
    if (m) return `${m[1]} ${m[2]}`;
    return slug;
  }

  async function _rest(path, opts) {
    opts = opts || {};
    const url = `${SUPABASE_URL}/rest/v1/${path}`;
    try {
      const r = await fetch(url, {
        method: opts.method || 'GET',
        headers: _headers(opts.headers),
        body: opts.body ? JSON.stringify(opts.body) : undefined
      });
      if (!r.ok) {
        console.warn(`[SupabaseSync] ${opts.method||'GET'} ${path} â†’ ${r.status}`);
        return { ok:false, status:r.status };
      }
      if (r.status === 204) return { ok:true, data:null };
      // Supabase POST without Prefer:return=representation returns 201 + empty body.
      // Guard against empty body before attempting JSON parse.
      const text = await r.text();
      if (!text) return { ok:true, data:null };
      try {
        const data = JSON.parse(text);
        return { ok:true, data };
      } catch (e) {
        console.warn('[SupabaseSync] non-JSON response', { status:r.status, body:text.slice(0,200) });

  async function _restAll(path, pageSize) {
    pageSize = pageSize || 1000;
    const MAX_PAGES = 50;        // hard safety cap = 50,000 rows
    const all = [];
    for (let page = 0; page < MAX_PAGES; page++) {
      const from = page * pageSize;
      const to   = from + pageSize - 1;
      try {
        const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
          method: 'GET',
          headers: _headers({
            'Range-Unit': 'items',
            'Range': `${from}-${to}`,
            'Prefer': 'count=none'
          })
        });
        if (!r.ok) {
          console.warn(`[SupabaseSync] paged GET ${path} page ${page} â†’ ${r.status}`);
          break;
        }
        const chunk = await r.json();
        if (!Array.isArray(chunk) || chunk.length === 0) break;
        all.push(...chunk);
        if (chunk.length < pageSize) break;   // last page
      } catch (e) {
        console.warn('[SupabaseSync] paged GET error', e);
        break;
      }
    }
    return { ok:true, data: all };
  }

  // â”€â”€ Public: always "configured" â€” no token rotation needed â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  function isConfigured() { return true; }

  function getConfig() {
    return { gist_id: 'supabase', token: 'supabase', backend: 'supabase' };
  }

  function saveConfig() { /* no-op â€” kept for back-compat */ }

  // â”€â”€ Cache helpers (kept so existing UI code works) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  function getCache() {
    try { return JSON.parse(localStorage.getItem(CACHE_KEY) || '{}'); }
    catch { return {}; }
  }

  function getCacheAge() {
    const ts = localStorage.getItem(CACHE_TS_KEY);
    return ts ? (Date.now() - parseInt(ts)) / 1000 : 9999;
  }

  function _setCacheBucket(fileKey, obj) {
    const cache = getCache();
    cache[fileKey] = obj;
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(cache)); } catch {}
    localStorage.setItem(CACHE_TS_KEY, Date.now().toString());
  }

  function _claimStage(stage) {
    const n = Number(stage || 1);
    return n === 2 ? 2 : 1;
  }

  function _claimStageSuffix(stage) {
    return _claimStage(stage) === 2 ? '__stage2' : '';
  }

  function _claimCompKey(agent, campId, debtorCode, stage) {
    return `${agent}_${campId}_${debtorCode}${_claimStageSuffix(stage)}`;
  }

  function _parseClaimCompKey(compKey, claimData) {
    let cleanKey = String(compKey || '');
    let stage = _claimStage(claimData && claimData.stage);
    const suffixMatch = cleanKey.match(/__stage(\d+)$/);
    if (suffixMatch) {
      stage = _claimStage(suffixMatch[1]);
      cleanKey = cleanKey.slice(0, suffixMatch.index);
    }
    const parts = cleanKey.split('_');
    return {
      agent: parts[0] || '',
      debtorCode: parts[parts.length - 1] || '',
      campId: parts.slice(1, -1).join('_'),
      stage
    };
  }

  // â”€â”€ Low-level pull/push (admin.html + management.html) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  // Keeps Gist-style file keys like "claims_Apr26", "flags_Apr26", "kpi_scores"
  async function pull(fileKey) {
    if (!fileKey) return null;

    if (fileKey.startsWith('claims_')) {
      const month = _monthFromSlug(fileKey.replace('claims_',''));
      const r = await _restAll(`claims?select=*&month=eq.${encodeURIComponent(month)}`);
      if (!r.ok) return null;
      const out = {};
      (r.data||[]).forEach(row => {
        const stage = _claimStage(row.stage);
        const k = _claimCompKey(row.agent, row.camp_id, row.debtor_code, stage);
        out[k] = {
          ts      : row.ts,
          remark  : row.remark || '',
          bulk    : !!row.bulk,
          status  : row.status || 'delivered',
          actor   : row.actor || 'agent',
          count   : (row.count != null) ? row.count : 1,
          campType: row.camp_type || null,
          stage
        };
      });
      _setCacheBucket(fileKey, out);
      return out;
    }

    if (fileKey.startsWith('flags_')) {
      const month = _monthFromSlug(fileKey.replace('flags_',''));
      const r = await _restAll(`flags?select=*&month=eq.${encodeURIComponent(month)}`);
      if (!r.ok) return null;
      const byAgent = {};
      (r.data||[]).forEach(row => {
        if (!byAgent[row.agent]) byAgent[row.agent] = {};
        byAgent[row.agent][row.debtor_code] = {
          reason: row.reason || '',
          ts    : row.ts
        };
      });
      _setCacheBucket(fileKey, byAgent);
      return byAgent;
    }

    if (fileKey === 'kpi_scores') {
      const r = await _restAll(`kpi_scores?select=*`);
      if (!r.ok) return null;
      const byMonth = {};
      (r.data||[]).forEach(row => {
        if (!byMonth[row.month]) byMonth[row.month] = {};
        byMonth[row.month][row.agent] = row.scores || {};
      });
      _setCacheBucket(fileKey, byMonth);
      return byMonth;
    }

    return null;
  }

  async function push(fileKey, data) {
    if (!fileKey) return false;

    if (fileKey.startsWith('claims_')) {
      const month = _monthFromSlug(fileKey.replace('claims_',''));
      const rows = Object.entries(data || {}).map(([compKey, v]) => {
        const parsed = _parseClaimCompKey(compKey, v || {});
        return {
          month,
          agent: parsed.agent,
          camp_id: parsed.campId,
          debtor_code: parsed.debtorCode,
          stage: parsed.stage,
          status   : v.status || 'delivered',
          remark   : v.remark || '',
          bulk     : !!v.bulk,
          actor    : v.actor || 'agent',
          ts       : _normalizeTs(v.ts),
          count    : Number.isFinite(v.count) ? v.count : 1,
          camp_type: v.campType || v.camp_type || null
        };
      });
      if (!rows.length) return true;
      const r = await _rest('claims?on_conflict=month,agent,camp_id,debtor_code,stage', {
        method: 'POST', headers: { 'Prefer': 'resolution=merge-duplicates' }, body: rows
      });
      _setCacheBucket(fileKey, data);
      return r.ok;
    }

    if (fileKey.startsWith('flags_')) {
      const month = _monthFromSlug(fileKey.replace('flags_',''));
      const rows = [];
      Object.entries(data || {}).forEach(([agent, flagsObj]) => {
        Object.entries(flagsObj || {}).forEach(([debtorCode, v]) => {
          rows.push({
            month, agent, debtor_code: debtorCode,
            reason: (v && v.reason) || '',
            ts    : _normalizeTs(v && v.ts)
          });
        });
      });
      if (!rows.length) return true;
      const r = await _rest('flags?on_conflict=month,agent,debtor_code', {
        method:'POST', headers:{'Prefer':'resolution=merge-duplicates'}, body: rows
      });
      _setCacheBucket(fileKey, data);
      return r.ok;
    }

    if (fileKey === 'kpi_scores') {
      const rows = [];
      Object.entries(data || {}).forEach(([month, agents]) => {
        Object.entries(agents || {}).forEach(([agent, scoresObj]) => {
          rows.push({ month, agent, scores: scoresObj || {}, updated_at: new Date().toISOString() });
        });
      });
      if (!rows.length) return true;
      const r = await _rest('kpi_scores?on_conflict=month,agent', {
        method:'POST', headers:{'Prefer':'resolution=merge-duplicates'}, body: rows
      });
      _setCacheBucket(fileKey, data);
      return r.ok;
    }

    return false;
  }

  // â”€â”€ Single-claim upsert (sales_dashboard.html main path) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  async function saveClaim(month, agent, campId, debtorCode, claimData, stage) {
    const slug  = _slug(month);
    const cleanStage = _claimStage(stage || (claimData && claimData.stage));
    const payload = { ...(claimData || {}), stage: cleanStage };
    const key   = _claimCompKey(agent, campId, debtorCode, cleanStage);
    const lsKey = `camp_claim_${slug}_${key}`;

    // Fire-and-forget localStorage first (instant UX).
    // We store the FULL claimData locally â€” UI reads extra fields like
    // `count` directly from here, so don't trim it.
    localStorage.setItem(lsKey, JSON.stringify(payload));

    // Upsert to Supabase. Schema-aware payload:
    //   - ts is normalized to ISO (UI may pass "24 Apr 14:32")
    //   - count defaults to 1 (matches DB default)
    //   - camp_type is snake_case on the wire but campType in JS
    const row = {
      month, agent, camp_id: campId, debtor_code: debtorCode,
      stage    : cleanStage,
      status   : payload.status || 'submitted',
      remark   : payload.remark || '',
      bulk     : !!payload.bulk,
      actor    : payload.actor || 'agent',
      ts       : _normalizeTs(payload.ts),
      count    : Number.isFinite(payload.count) ? payload.count : 1,
      camp_type: payload.campType || payload.camp_type || null
    };
    _rest('claims?on_conflict=month,agent,camp_id,debtor_code,stage', {
      method:'POST', headers:{'Prefer':'resolution=merge-duplicates'}, body:[row]
    }).catch(()=>{});

    // Update cache bucket
    const cache = getCache();
    const fk = `claims_${slug}`;
    if (!cache[fk]) cache[fk] = {};
    cache[fk][key] = payload;
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(cache)); } catch {}
  }

  async function removeClaim(month, agent, campId, debtorCode, stage) {
    const slug = _slug(month);
    const cleanStage = _claimStage(stage);
    const key  = _claimCompKey(agent, campId, debtorCode, cleanStage);
    localStorage.removeItem(`camp_claim_${slug}_${key}`);

    _rest(`claims?month=eq.${encodeURIComponent(month)}&agent=eq.${encodeURIComponent(agent)}&camp_id=eq.${encodeURIComponent(campId)}&debtor_code=eq.${encodeURIComponent(debtorCode)}&stage=eq.${cleanStage}`, {
      method: 'DELETE'
    }).catch(()=>{});

    const cache = getCache();
    const fk = `claims_${slug}`;
    if (cache[fk]) {
      delete cache[fk][key];
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(cache)); } catch {}
    }
  }

  // â”€â”€ Flags (per-agent bulk write) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  async function saveFlags(month, agent, flags) {
    const slug = _slug(month);
    localStorage.setItem(`touro_debtor_flags_${agent}`, JSON.stringify(flags));

    // Replace all flags for this agent+month: delete existing, then insert
    await _rest(`flags?month=eq.${encodeURIComponent(month)}&agent=eq.${encodeURIComponent(agent)}`, { method:'DELETE' });

    const rows = Object.entries(flags || {}).map(([debtorCode, v]) => ({
      month, agent, debtor_code: debtorCode,
      reason: (v && v.reason) || '',
      ts    : _normalizeTs(v && v.ts)
    }));
    if (rows.length) {
      await _rest('flags', { method:'POST', body: rows });
    }

    const cache = getCache();
    const fk = `flags_${slug}`;
    if (!cache[fk]) cache[fk] = {};
    cache[fk][agent] = flags;
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(cache)); } catch {}
  }

  // â”€â”€ KPI scores (by month + agent) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  async function saveKPIScores(month, scores) {
    const slug = _slug(month);
    localStorage.setItem(`md_scores_${slug}`, JSON.stringify(scores));

    // scores can be either { AGENT: {...}, AGENT2: {...}, ... } (multi-agent)
    // or { scoreKey: value, ... } (single agent â€” accounts.html pattern)
    // Detect shape: if values are objects, it's multi-agent; otherwise single.
    const entries = Object.entries(scores || {});
    const isMultiAgent = entries.length > 0 &&
                         entries.every(([, v]) => v && typeof v === 'object' && !Array.isArray(v));

    let rows;
    if (isMultiAgent) {
      rows = entries.map(([agent, s]) => ({
        month, agent, scores: s || {}, updated_at: new Date().toISOString()
      }));
    } else {
      // Single-agent shape â€” caller didn't wrap by agent.
      // This path shouldn't trigger in current code; log for visibility.
      console.warn('[SupabaseSync] saveKPIScores called with non-multi-agent shape; skipping upsert', scores);
      rows = [];
    }

    if (rows.length) {
      const r = await _rest('kpi_scores?on_conflict=month,agent', {
        method:'POST', headers:{'Prefer':'resolution=merge-duplicates'}, body: rows
      });
      if (r.ok) console.log(`[SupabaseSync] KPI scores for ${month} saved âœ“`);
    }

    const cache = getCache();
    if (!cache.kpi_scores) cache.kpi_scores = {};
    cache.kpi_scores[month] = scores;
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(cache)); } catch {}
  }

  // â”€â”€ Bulk sync from Supabase â†’ localStorage (called on page load) â”€â”€â”€â”€â”€
  async function syncToLocal(month, opts) {
    opts = opts || {};
    const slug = _slug(month);
    if (!slug) return { ok:false, reason:'no_month' };

    try {
      const [claimsRes, flagsRes, kpiRes] = await Promise.all([
        _restAll(`claims?select=*&month=eq.${encodeURIComponent(month)}`),
        _restAll(`flags?select=*&month=eq.${encodeURIComponent(month)}`),
        _restAll(`kpi_scores?select=*&month=eq.${encodeURIComponent(month)}`)
      ]);

      if (!claimsRes.ok) return { ok:false, reason:'claims_fetch_failed' };

      // Populate camp_claim_* keys for back-compat readers
      let claimCount = 0;
      const claimsObj = {};
      (claimsRes.data || []).forEach(row => {
        const stage = _claimStage(row.stage);
        const compKey = _claimCompKey(row.agent, row.camp_id, row.debtor_code, stage);
        const lsKey   = `camp_claim_${slug}_${compKey}`;
        const val = {
          ts      : row.ts,
          remark  : row.remark || '',
          bulk    : !!row.bulk,
          status  : row.status || 'delivered',
          actor   : row.actor || 'agent',
          count   : (row.count != null) ? row.count : 1,
          campType: row.camp_type || null,
          stage
        };
        localStorage.setItem(lsKey, JSON.stringify(val));
        claimsObj[compKey] = val;
        claimCount++;
      });

      // Flags per agent
      let flagCount = 0;
      const flagsByAgent = {};
      (flagsRes.data || []).forEach(row => {
        if (!flagsByAgent[row.agent]) flagsByAgent[row.agent] = {};
        flagsByAgent[row.agent][row.debtor_code] = {
          reason: row.reason || '',
          ts    : row.ts
        };
      });
      Object.entries(flagsByAgent).forEach(([agent, flags]) => {
        localStorage.setItem(`touro_debtor_flags_${agent}`, JSON.stringify(flags));
        flagCount++;
      });

      // KPI scores
      const kpiByAgent = {};
      (kpiRes.data || []).forEach(row => {
        kpiByAgent[row.agent] = row.scores || {};
      });
      if (Object.keys(kpiByAgent).length) {
        localStorage.setItem(`md_scores_${slug}`, JSON.stringify(kpiByAgent));
      }

      // Refresh shared cache bucket
      const cache = getCache();
      cache[`claims_${slug}`] = claimsObj;
      cache[`flags_${slug}`]  = flagsByAgent;
      if (!cache.kpi_scores) cache.kpi_scores = {};
      cache.kpi_scores[month] = kpiByAgent;
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(cache)); } catch {}
      localStorage.setItem(CACHE_TS_KEY, Date.now().toString());

      console.log(`[SupabaseSync] Pulled ${claimCount} claims, ${flagCount} agents' flags for ${month}`);
      return { ok:true, claimCount, flagCount };
    } catch (e) {
      console.warn('[SupabaseSync] syncToLocal error', e);
      return { ok:false, reason:'exception', error:e };
    }
  }

  // â”€â”€ Back-compat: setup/createGist are no-ops now â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  async function setup() { return { ok:true, gist_id:'supabase', backend:'supabase' }; }
  async function createGist() { return { ok:true, gist_id:'supabase', url:SUPABASE_URL }; }

  // â”€â”€ Realtime subscription (optional, caller opts in) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  // Returns an unsubscribe fn. Requires supabase-js CDN loaded on the page.
  let _realtimeClient = null;
  function subscribeClaims(month, cb) {
    try {
      if (typeof supabase === 'undefined' || !supabase.createClient) {
        console.warn('[SupabaseSync] realtime unavailable: supabase-js not loaded');
        return () => {};
      }
      if (!_realtimeClient) {
        _realtimeClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
      const channel = _realtimeClient
        .channel(`claims_${_slug(month)}`)
        .on('postgres_changes',
          { event: '*', schema: 'public', table: 'claims', filter: `month=eq.${month}` },
          (payload) => { try { cb(payload); } catch(e){} }
        )
        .subscribe();
      return () => { try { _realtimeClient.removeChannel(channel); } catch(e){} };
    } catch (e) {
      console.warn('[SupabaseSync] subscribeClaims failed', e);
      return () => {};
    }
  }

  // â”€â”€ Audit log (fire-and-forget) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  function logAudit(actor, action, month, details) {
    _rest('audit_log', {
      method:'POST',
      body: [{ actor, action, month: month || null, details: details || {} }]
    }).catch(()=>{});
  }

  // â”€â”€ Public API (same shape as original GistSync) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  return {
    isConfigured, getConfig, saveConfig, setup, createGist,
    pull, push,
    saveClaim, removeClaim, saveFlags, saveKPIScores,
    syncToLocal, getCache, getCacheAge,
    subscribeClaims, logAudit,
    _backend: 'supabase'
  };
})();

// Back-compat export
if (typeof module !== 'undefined') module.exports = GistSync;
</script>
</body>
</html>
